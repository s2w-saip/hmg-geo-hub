# 린트 · 시험 설정만 둔다. 서버마다 의존성은 자기 폴더의 requirements.txt다(data_server · hub_server · ext · analytics).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["data_server/tests", "hub_server/tests", "ext/tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "SIM", "B", "I"]
ignore = ["B008", "E501"]   # B008: FastAPI Depends()·Query() 기본값 관례, E501: 긴 설명 문자열
