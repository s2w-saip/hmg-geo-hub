<text x="1244" y="619" font-size="15" font-weight="400" class="label">승인 뷰</text>
<text x="268" y="761" font-size="17" font-weight="400" class="label">각 DB는 별도 PostgreSQL 컨테이너 · 볼륨 · 계정 · Docker 네트워크로 격리</text>
<rect x="40" y="820" width="1650" height="138" rx="16" fill="#fff" stroke="#d5dfeb"/>
<text x="66" y="854" font-size="20" font-weight="700">정의 동기화</text>
<text x="230" y="854" font-size="18" font-weight="400">관리 명령이 Gold 정의를 데이터 DB에 버전 기록 → 존재를 확인한 UUID만 운영 DB에 등록</text>
<text x="66" y="889" font-size="20" font-weight="700">데이터 상태</text>
<text x="230" y="889" font-size="18" font-weight="400">실제 원천 정의만 기록 · GA4 / SEO 수집기는 아직 미연결 · 미관측 지표는 “데이터 없음”</text>
<text x="66" y="926" font-size="20" font-weight="700">접근 경계</text>
<text x="230" y="926" font-size="18" font-weight="400">DB 포트는 127.0.0.1에만 바인딩 · 실선: 현재 조회 경로 · 점선: 외부 연결 준비</text>
