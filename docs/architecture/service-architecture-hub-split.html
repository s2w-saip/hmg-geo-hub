<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비스 아키텍처</title>
<style>
:root {
  --bg: #F3F5F7; --panel: #FFFFFF; --soft: #E7ECF1; --fg: #17202B; --muted: #586474; --line: #B9C3CF; --edge: #3E4A59;
  --hub: #0B706B; --hub-bg: #E2F2EF; --gold: #94620A; --gold-bg: #FAF1DF; --write: #BF3A22; --new: #3F4FC4; --new-bg: #E9EBFB; --data: #8135A8; --data-bg: #F4EAF9;
  --sans: "Pretendard", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1217; --panel: #161C23; --soft: #1C232C; --fg: #E2E7ED; --muted: #97A2B0; --line: #3B4551; --edge: #AEB8C4;
    --hub: #4FBFB6; --hub-bg: #122A29; --gold: #E0A64B; --gold-bg: #2A2418; --write: #F07B63; --new: #A3AEFF; --new-bg: #1D2245; --data: #D29BEF; --data-bg: #2A1B35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1217; --panel: #161C23; --soft: #1C232C; --fg: #E2E7ED; --muted: #97A2B0; --line: #3B4551; --edge: #AEB8C4;
  --hub: #4FBFB6; --hub-bg: #122A29; --gold: #E0A64B; --gold-bg: #2A2418; --write: #F07B63; --new: #A3AEFF; --new-bg: #1D2245; --data: #D29BEF; --data-bg: #2A1B35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); }
figure { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
figcaption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
svg { display: block; width: 100%; height: 100%; }

text { fill: var(--fg); font-family: var(--sans); font-size: 13px; }
.c { text-anchor: middle; }
.r { text-anchor: end; }
.title { font-size: 22px; font-weight: 700; }
.b { font-weight: 700; font-size: 14px; }
.h { font-weight: 700; font-size: 16px; }
.sm { font-size: 12px; fill: var(--muted); }
.m { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
.ms { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.mb { font-family: var(--mono); font-size: 13px; font-weight: 700; }
.port { font-family: var(--mono); font-size: 12px; fill: var(--muted); font-weight: 400; }
.lb { font-size: 12px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.lbw { fill: var(--write); font-weight: 600; }
.lbn { fill: var(--new); font-weight: 600; }
.d { font-size: 12px; }
.rw { font-weight: 700; fill: var(--fg); }
.rwn { font-weight: 700; fill: var(--write); }
.sep { fill: none; stroke: var(--line); stroke-width: 1; }

.boundary { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.cont { fill: var(--soft); stroke: var(--line); }
.proc { fill: var(--panel); stroke: var(--line); }
.mini { fill: var(--soft); stroke: var(--line); }
.hub { fill: var(--hub-bg); stroke: var(--hub); stroke-width: 1.4; }
.key { fill: var(--panel); stroke: var(--fg); stroke-width: 1.8; }
.new { fill: var(--new-bg); stroke: var(--new); stroke-width: 2; }
.data { fill: var(--data-bg); stroke: var(--data); stroke-width: 2; }
.ext { fill: none; stroke: var(--muted); }

.e, .w, .n { fill: none; stroke-linecap: butt; }
.e { stroke: var(--edge); stroke-width: 1.6; }
.w { stroke: var(--write); stroke-width: 1.9; }
.n { stroke: var(--new); stroke-width: 2; }
.ah-e { fill: var(--edge); } .ah-w { fill: var(--write); } .ah-n { fill: var(--new); }
</style>
</head>
<body>
<figure>
  <figcaption>허브 서버 분리안: Next는 허브 서버만 부른다. 쓰기는 허브 서버에서 끝나고, 허브 서버는 화면 · 지표 · 입력 데이터 목록(Gold 값 포함)의 읽기 요청만 내부 전용 데이터 서버로 넘긴다. 허브 서버만 사용자 데이터 DB에 접속한다. 데이터 서버가 요청을 처리하며 쓰는 DB는 캐시 DB뿐이고, Gold는 데이터 서버 코드로 도는 사전 집계 작업이 저장한다. 원천 데이터는 Silver OBT 하나다. 필터 조회는 cron job이 Silver를 가공해 저장한 gold_db 조회용 테이블에서 센다.</figcaption>
  <svg viewBox="0 0 1840 880" role="img" aria-label="허브 서버 분리안. 브라우저는 Next.js를 부르고 Next.js는 허브 서버만 부른다. 쓰기는 허브 서버에서 끝나고, 허브 서버는 로그인과 계정 재확인 뒤 화면, 지표, Gold 값을 포함한 입력 데이터 목록의 읽기 요청만 내부 전용 데이터 서버로 넘긴다. 입력 데이터 DB와 사용자 데이터 DB는 허브 서버가 읽고 쓰며, 데이터 서버는 입력 데이터 DB만 읽는다. 데이터 서버는 Gold DB를 읽고 캐시 DB를 읽고 쓰며, 허브 서버는 Gold DB에 접속하지 않는다. 원천 데이터는 파이프라인 Silver OBT 하나다.">
