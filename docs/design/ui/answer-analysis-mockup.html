<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer analysis 리뉴얼 목업</title>
<style>
  @font-face {
    font-family: "Pretendard";
    src: url("../../../front/public/fonts/PretendardVariable.woff2") format("woff2-variations"),
         url("../../../front/public/fonts/PretendardVariable.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  /* Layout: same left filter panel + saved filters as the prompt page, then a KPI scoreboard
     (five rows; the focused KPI is the one navy element) that drives the market section below:
     region-grouped market tiles, brand comparison and a region › country table. HMG tokens only. */
  :root {
    --navy: #002c5f; --navy-500: #1a4d8e; --navy-300: #6b89b3; --navy-50: #e6eaf0; --navy-900: #001533; --navy-25: #f2f5fd; --navy-tint: rgba(0, 44, 95, .08);
    --sky: #aacae6; --sand-inset: #eee9e2; --sand-light: #f6f3f2; --white: #ffffff;
    --ink: #0a0908; --ink-2: #2b2825; --ink-muted: #6b6660; --ink-faint: #939393; --line: #ece8e3; --line-2: #e2ddd6;
    --up: #2d9257; --down: #e63312;   /* delta direction: app tokens --color-positive / --color-danger (icons and tints only) */
    --font: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
    --shadow-1: 0 1px 2px rgba(10,9,8,.05), 0 1px 3px rgba(10,9,8,.06);
    --shadow-3: 0 24px 56px -16px rgba(10,9,8,.30), 0 6px 16px rgba(10,9,8,.08);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--sand-light); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.s12 { width: 12px; height: 12px; } svg.i.s14 { width: 14px; height: 14px; } svg.i.s18 { width: 18px; height: 18px; } svg.i.s20 { width: 20px; height: 20px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-muted); }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--white); color: var(--ink-2); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ── Mockup bar ── */
  .mk { position: sticky; top: 0; z-index: 100; background: #1c1f24; color: #e6e8eb; font-size: 12px; }
  .mk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px; }
  .mk-tag { background: #f4c542; color: #1c1f24; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .mk-title { font-weight: 600; }
  .mk-btn { border: 1px solid #3a414b; background: transparent; color: #cfd4da; font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
  .mk-btn[aria-pressed="true"] { background: #e6e8eb; color: #1c1f24; border-color: #e6e8eb; font-weight: 600; }
  .mk-group { display: inline-flex; align-items: center; gap: 4px; }
  .mk-group > span { color: #9aa3ad; margin-right: 2px; }
  .mk-cap { border-top: 1px solid #2c323a; padding: 8px 16px; color: #cfd4da; line-height: 1.6; display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  .mk-cap b { color: #fff; }
  .mk-cap kbd { background: #2a3038; color: #e6e8eb; border-color: #3a414b; }
  .mk-note { color: #9aa3ad; margin-left: auto; }

  /* ── Shell ── */
  .hdr { height: 56px; background: var(--white); box-shadow: var(--shadow-1); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: relative; z-index: 2; }
  .wordmark { font-weight: 800; color: var(--navy); font-size: 15px; }
  .wordmark small { font-weight: 600; color: var(--ink-muted); font-size: 12px; margin-left: 6px; }
  .shell { display: flex; min-height: calc(100vh - 56px); }
  .rail { width: 80px; background: var(--navy); flex-shrink: 0; padding: 16px 8px; }
  .rail a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 8px; font-size: 11px; font-weight: 500; color: rgba(255,255,255,.85); }
  .rail a.on { background: rgba(255,255,255,.2); color: #fff; }
  .snb { width: 240px; background: var(--white); border-right: 1px solid var(--line); padding: 24px 12px; flex-shrink: 0; }
  .snb a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: rgba(10,9,8,.8); }
  .snb a.on { background: rgba(0,44,95,.1); color: var(--navy); }
  .snb a[href] { cursor: pointer; }
  .snb a[href]:not(.on):hover { background: rgba(0,44,95,.06); color: var(--navy); }
  .snb a[aria-disabled="true"] { color: rgba(10,9,8,.4); cursor: default; }
  .main { flex: 1; min-width: 0; padding: 32px 40px 72px; }
  .wrap { max-width: 1152px; margin: 0 auto; }

  /* ── Buttons ── */
  .btn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line-2); background: var(--white); color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: var(--ink-faint); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-muted); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
  .icon { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-muted); }
  .icon:hover { background: var(--sand-inset); color: var(--ink); }
  .lnk { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--navy); }
  .lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
  .lnk[aria-disabled="true"] { color: var(--ink-muted); cursor: default; text-decoration: none; }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
  .clear { all: unset; cursor: pointer; font-size: 12px; color: var(--ink-muted); text-decoration: underline; text-underline-offset: 3px; }

  /* ── Layout ── */
  .split { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 20px; align-items: start; }
  .split.collapsed { grid-template-columns: 52px minmax(0, 1fr); }
  .content { display: flex; flex-direction: column; gap: 16px; min-width: 0; container-type: inline-size; }

  /* ── Panel (same as the prompt page) ── */
  .side { background: var(--white); border-radius: 14px; box-shadow: var(--shadow-1); position: sticky; top: calc(var(--mk-h, 0px) + 16px); max-height: calc(100vh - var(--mk-h, 0px) - 32px); overflow: auto; overscroll-behavior: contain; }
  .side-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 18px; background: var(--white); border-bottom: 1px solid var(--line); }
  .side-top b { font-size: 15px; }
  .side-top .cnt { font-size: 12px; color: var(--ink-muted); }
  .side-top .icon { margin-left: auto; }
  .rail2 { background: var(--white); border-radius: 14px; box-shadow: var(--shadow-1); position: sticky; top: calc(var(--mk-h, 0px) + 16px); padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .rail2 .icon { width: 36px; height: 36px; position: relative; }
  .rail2 .badge { position: absolute; top: -2px; right: -4px; }
  .sec { border-bottom: 1px solid var(--line); }
  .sec-h { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px 18px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .sec-h .chev { color: var(--ink-muted); transition: transform .15s var(--ease); }
  .sec-h[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .sec-h .sum { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--navy); max-width: 150px; text-align: right; }
  .sec-b { padding: 0 8px 12px; }
  .sec-help { margin: -2px 10px 6px; font-size: 12px; color: var(--ink-muted); }
  .seg { display: flex; padding: 3px; background: var(--sand-inset); border-radius: 9px; margin: 0 2px 6px; }
  .seg button { all: unset; cursor: pointer; flex: 1; text-align: center; height: 30px; line-height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink-muted); }
  .seg button.on { background: var(--white); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-1); }
  .range { display: flex; align-items: center; justify-content: space-between; margin: 0 10px; font-size: 12px; color: var(--ink-muted); }
  .range b { color: var(--ink-2); font-weight: 600; }
  .finwrap { position: relative; display: block; margin: 0 2px 6px; }
  .finwrap .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); }
  .finput { width: 100%; height: 34px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px 0 32px; font-size: 13px; color: var(--ink); background: var(--white); outline: none; }
  .finput:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,44,95,.12); }
  .finput::placeholder { color: var(--ink-muted); }
  /* option row = RnCheckRow: [box 16px] [label] [meta] */
  .tn { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .tn:hover { background: var(--sand-light); }
  .tn .tw { all: unset; cursor: pointer; width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-muted); border-radius: 4px; }
  .tn .tw.open .i { transform: rotate(90deg); }
  .tn .lab { min-width: 0; overflow-wrap: break-word; padding: 6px 0; line-height: 1.4; }
  .tn .c { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .tn.lv0 { font-weight: 700; color: var(--ink); }
  .tn.lv1 { font-weight: 600; }
  .tn.zero { color: var(--ink-muted); cursor: default; }
  .tn.zero:hover { background: none; }
  .tn.none { cursor: default; }
  .tn.none .lab { font-style: italic; color: var(--ink-muted); }
  .cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--ink-faint); background: var(--white); display: grid; place-items: center; color: #fff; }
  .cb.on { background: var(--navy); border-color: var(--navy); }
  .cb.inh { background: var(--navy-300); border-color: var(--navy-300); }
  .cb.part { border-color: var(--navy); }
  .cb.part::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--navy); }
  .cb.radio { border-radius: 50%; }
  .cb.radio.on::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .tn.zero .cb { border-color: var(--line-2); }
  .code { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); background: var(--sand-inset); padding: 1px 5px; border-radius: 4px; margin-right: 6px; }
  .side-foot { padding: 12px 18px 14px; font-size: 12px; color: var(--ink-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .psec { padding-bottom: 10px; border-bottom: 1px solid var(--line); background: linear-gradient(var(--navy-25), var(--white) 70%); }
  .psec .sec-h { cursor: default; }
  .psec .sec-h .lnk { margin-left: auto; }
  .plist { list-style: none; margin: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
  .pi { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 30px; align-items: center; gap: 4px; border-radius: 8px; }
  .pi:hover { background: var(--white); box-shadow: inset 0 0 0 1px var(--line-2); }
  .pi.on { background: var(--white); box-shadow: inset 0 0 0 1.5px var(--navy); }
  .pa { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 1px; padding: 8px 4px 8px 10px; min-width: 0; }
  .pa .pt { font-size: 13px; font-weight: 600; color: var(--ink); }
  .pa .pt .star { color: var(--navy); font-size: 12px; margin-right: 4px; }
  .pa .ps { font-size: 12px; color: var(--ink-muted); overflow-wrap: break-word; }
  .pi .pm { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-muted); }
  .pi .pm:hover { background: var(--sand-inset); color: var(--ink); }
  .menu { position: absolute; right: 4px; top: 100%; z-index: 20; min-width: 168px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-3); padding: 6px; display: flex; flex-direction: column; }
  .menu button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--ink-2); }
  .menu button:hover, .menu button:focus-visible { background: var(--sand-light); }
  .menu button.danger { color: #b42318; }
  .psave { display: flex; gap: 6px; padding: 0 10px 8px; }
  .psave input { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--navy); border-radius: 6px; padding: 0 8px; font-size: 13px; outline: none; box-shadow: 0 0 0 3px rgba(0,44,95,.12); }
  .pdirty { margin: 6px 10px 0; padding: 8px 10px; border-radius: 8px; background: var(--white); border: 1px dashed var(--navy-300); font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .pdirty .acts { display: flex; gap: 10px; margin-left: auto; }

  /* ── Page header ── */
  .ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .ph h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
  .ph .sub { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--white); font-size: 12px; color: var(--ink-2); }
  .pill b { font-weight: 700; }
  .applied { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 28px; font-size: 13px; }
  .tok { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 6px 0 10px; border-radius: 6px; background: var(--navy-tint); color: var(--navy); font-size: 12px; font-weight: 700; }
  .tok > span { font-weight: 500; }
  .tok button { all: unset; cursor: pointer; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; }
  .tok button:hover { background: rgba(0,44,95,.12); }
  .upd { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--navy); }
  .note { padding: 10px 14px; border-radius: 10px; background: var(--white); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }

  /* ── Card ── */
  .card { background: var(--white); border-radius: 14px; box-shadow: var(--shadow-1); position: relative; }
  .card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 16px 20px 12px 24px; }
  .card-h h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .card-h .hint { font-size: 12px; color: var(--ink-muted); }
  .card-h .r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; overflow: hidden; z-index: 3; border-radius: 14px 14px 0 0; background: var(--navy-25); }
  .progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--navy); animation: slide 1s var(--ease) infinite; }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }

  /* ── KPI scoreboard ── */
  .board { container-type: inline-size; }
  .bh, .kr { display: grid; grid-template-columns: minmax(150px, 1.3fr) 100px 96px minmax(88px, 1fr) minmax(120px, 1fr) 32px; align-items: center; gap: 12px; padding: 0 16px 0 24px; }
  .bh { height: 34px; font-size: 12px; font-weight: 600; color: var(--ink-muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--white); }
  .kr { min-height: 72px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; transition: background .12s; }
  .kr:last-child { border-bottom: 0; border-radius: 0 0 14px 14px; }
  .kr:last-child::before { border-bottom-left-radius: 14px; }
  @container (max-width: 700px) { .bh, .kr { grid-template-columns: minmax(150px, 1.3fr) 100px 96px minmax(88px, 1fr) 32px; } .bh .rvh, .kr .rv { display: none; } }
  .kr:hover { background: var(--navy-25); }
  .kr .kn { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; min-width: 0; }
  .kr .kn > b { font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .kr .kn small { font-size: 12px; color: var(--ink-muted); }
  .kr .kv { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .kr .kv small { font-size: 15px; font-weight: 600; margin-left: 1px; }
  .kr .rv { font-size: 12px; color: var(--ink-muted); line-height: 1.4; }
  .kr .rv b { color: var(--ink-2); font-weight: 600; }
  .kr .go { color: var(--ink-muted); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; }
  .kr .go:hover { background: var(--sand-inset); color: var(--ink); }
  .kr.on { background: var(--navy); color: #fff; }
  .kr.on .kn small, .kr.on .rv { color: rgba(255,255,255,.75); }
  .kr.on .rv b { color: #fff; }
  .kr.on .go { color: #fff; }
  .kr.on .go:hover { background: rgba(255,255,255,.14); }
  .kr.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sky); }
  .info { all: unset; cursor: help; position: relative; display: inline-grid; place-items: center; color: inherit; opacity: .7; }
  .info:hover, .info:focus-visible { opacity: 1; }
  .tip { display: none; position: absolute; left: 24px; top: calc(100% - 6px); z-index: 30; width: 360px; padding: 12px 14px; background: var(--ink); color: #fff; border-radius: 10px; box-shadow: var(--shadow-3); font-size: 12px; line-height: 1.55; font-weight: 400; cursor: default; }
  .tip b { display: block; font-size: 12px; color: var(--sky); margin-top: 6px; }
  .tip b:first-child { margin-top: 0; }
  .kr:has(.info:hover) .tip, .kr:has(.info:focus-visible) .tip { display: block; }
  /* change chip = RnToneChip: tone up/down/flat/none; colour on the icon + tint only */
  .dlt { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--sand-inset); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dlt.up { background: rgba(45,146,87,.12); }
  .dlt.down { background: rgba(230,51,18,.1); }
  .dlt.none { color: var(--ink-muted); }
  .dlt .i { width: 12px; height: 12px; stroke-width: 2.5; color: var(--ink-muted); }
  .dlt.up .i { color: var(--up); }
  .dlt.down .i { color: var(--down); }
  .kr.on .dlt { background: var(--white); }
  .spark { width: 100%; height: 36px; display: block; }
  .spark .ln { fill: none; stroke: var(--navy); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .spark .ar { fill: var(--navy-tint); }
  .spark .pt { fill: var(--navy); }
  .kr.on .spark .ln { stroke: var(--sky); }
  .kr.on .spark .ar { fill: rgba(170,202,230,.18); }
  .kr.on .spark .pt { fill: #fff; }

  /* ── Market section ── */
  /* tiles + brands side by side from a 1100px-wide content column (@min-[1100px]/rncontent) */
  .focus-g { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @container (min-width: 1100px) { .focus-g { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
  .legend { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); }
  .legend i { width: 20px; height: 10px; border-radius: 2px; display: inline-block; }
  .tiles { padding: 4px 24px 20px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 24px; }
  .rg { max-width: 100%; }
  .rg h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
  .rg h4 span { font-weight: 500; color: var(--ink-muted); }
  .tg { display: flex; flex-wrap: wrap; gap: 4px; }
  .tile { all: unset; cursor: pointer; width: 64px; height: 50px; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; position: relative; box-shadow: inset 0 0 0 1px rgba(10,9,8,.06); }
  .tile .c { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .tile .v { font-size: 12px; font-weight: 600; }
  .tile.dark { color: #fff; }
  .tile.hi { box-shadow: 0 0 0 2px var(--white), 0 0 0 4px var(--ink); z-index: 1; }
  .brands { padding: 0 24px 20px; display: flex; flex-direction: column; gap: 8px; }
  .br { display: grid; grid-template-columns: minmax(0, 120px) minmax(40px, 1fr) 72px 84px; align-items: center; gap: 10px; font-size: 13px; }
  .br .nm { display: flex; align-items: center; gap: 6px; font-weight: 600; min-width: 0; }
  .br .nm > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .br .nm .own { font-size: 11px; font-weight: 700; color: var(--navy); background: var(--navy-tint); padding: 0 6px; border-radius: 4px; }
  .br .bar { height: 10px; border-radius: 3px; background: var(--sand-light); overflow: hidden; }
  .br .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink-faint); transition: width .25s var(--ease); }
  .br.ours .bar i { background: var(--navy); }
  .br .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .br .dl { text-align: right; }
  .rank { font-size: 12px; color: var(--ink-muted); }
  .nodata { margin: 0 24px 20px; padding: 14px; border-radius: 10px; background: var(--sand-light); font-size: 12px; color: var(--ink-muted); }
  .tblwrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  th { height: 38px; text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-muted); padding: 0 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--white); }
  th:first-child, td:first-child { padding-left: 24px; }
  th:last-child, td:last-child { padding-right: 24px; }
  th.r, td.r { text-align: right; }

  tr.reg td { background: var(--sand-light); font-weight: 700; }
  tr.reg td.r { font-weight: 600; }
  .regbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .regbtn:focus-visible { outline: 2px solid var(--navy); }
  .regbtn .chev2 { margin-right: 0; }
  tr.cty td:first-child { padding-left: 48px; }
  tr.cty { cursor: pointer; }
  tr.cty:hover td { background: var(--navy-25); }
  tr.cty.hi td { background: var(--navy-25); box-shadow: inset 0 1px 0 var(--navy-300), inset 0 -1px 0 var(--navy-300); }
  .vb { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 10px; }
  .vb b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
  tr.reg .vb b { font-weight: 700; }
  .vb .bar { height: 8px; border-radius: 3px; background: var(--sand-light); overflow: hidden; }
  .vb .bar i { display: block; height: 100%; border-radius: 3px; background: var(--navy); }
  tr.reg .vb .bar i { background: var(--navy-500); }
  .rival { font-size: 12px; color: var(--ink-muted); font-weight: 400; }
  .rival b { color: var(--ink-2); font-weight: 600; }
  .chev2 { display: inline-flex; vertical-align: -3px; margin-right: 6px; color: var(--ink-muted); transition: transform .15s; }
  .chev2.open { transform: rotate(90deg); }
  .divider { display: inline-block; width: 1px; height: 12px; background: var(--line-2); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: #fff; border-radius: 10px; box-shadow: var(--shadow-3); padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .toast button { all: unset; cursor: pointer; font-weight: 700; color: var(--sky); padding: 4px 8px; border-radius: 6px; }
  /* app-parity panel parts */
  .grp-h { padding: 14px 18px 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--ink-muted); }
  .sec-h .badge { margin-left: auto; }
  .pempty { margin: 0; padding: 0 18px 4px; font-size: 12px; color: var(--ink-muted); }
  .gh { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 4px; width: 100%; padding: 10px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ink-muted); }
  .gh:hover { color: var(--ink); }
  .gh.on { color: var(--navy); }
  .clr { display: inline-block; margin: 6px 10px 0; }
  .tn.dis { color: var(--ink-muted); cursor: not-allowed; }
  .cal-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 10px 4px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .cal-t > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .cal-t .num { font-weight: 600; color: var(--navy); }
  .cal { margin: 0 2px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 8px; }
  .cal-h { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; }
  .cal-h .icon:disabled { opacity: .35; cursor: default; }
  .cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; margin-top: 4px; }
  .cal-g .wd { font-size: 11px; color: var(--ink-muted); padding: 2px 0; }
  .cal-g button { all: unset; box-sizing: border-box; height: 28px; border-radius: 6px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-muted); text-align: center; }
  .cal-g button.rd { cursor: pointer; color: var(--navy); font-weight: 700; background: var(--navy-25); }
  .cal-g button.rd:hover { background: var(--navy-50); }
  .cal-g button.in { background: var(--navy-50); }
  .cal-g button.end { background: var(--navy); color: #fff; }
  .cal-g button.def { box-shadow: inset 0 0 0 1.5px var(--navy); }
  .cal-g button:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
  .cal-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 10px 0; font-size: 12px; color: var(--ink-muted); }
  .cal .cal-f { margin: 6px 0 0; }
  .cal-f .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--navy); margin-right: 6px; }
  .cal-f b { color: var(--ink-2); }
  .side-foot { flex-direction: column; }
  .mk-cap code { font-family: var(--mono); font-size: 11px; color: #fff; }

  /* ══ Answer analysis (Mention · Citation) ══
     Same shell, panel and saved filters as the Overview mockup. New here: the KPI lens
     (4 tiles, the picked one is the navy element), hero figure + trend, ranked bars instead
     of donuts, small multiples, drawers instead of inline rows and modals, chart table twins.
     Chart colours: 당사/공식(HMG) = HMG navy, up to 3 comparison brands = orange · aqua · violet,
     every other brand = grey (validated: dataviz validate_palette.js, all-pairs). */
  :root {
    --own: #002c5f; --c1: #eb6834; --c2: #1baf7a; --c3: #6250d6; --ctx: #c9c3bb; --ctx-2: #ddd8d1;
    --pos: #2a78d6; --neu: #d9d4cd; --mix: #f1a3a2; --neg: #e34948;
    --good-ink: #1d6b40; --bad-ink: #b42318;
  }
  .snb .grp { padding: 14px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ink-muted); }
  .snb a.sub { padding-left: 24px; }
  .snb a.sub::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .45; }
  .snb .beta { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--navy); background: var(--navy-tint); border-radius: 4px; padding: 0 5px; }

  /* page header */
  .ph .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--navy); }
  .ph .desc { margin: 6px 0 0; font-size: 13px; color: var(--ink-muted); }
  .ph .acts { display: flex; align-items: center; gap: 8px; }
  .pswitch { display: inline-flex; padding: 3px; background: var(--sand-inset); border-radius: 9px; }
  .pswitch a { height: 28px; line-height: 28px; padding: 0 12px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--ink-muted); cursor: pointer; text-decoration: none; }
  .pswitch a.on { background: var(--white); color: var(--ink); box-shadow: var(--shadow-1); }
  .back { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--navy); }
  .back:hover { text-decoration: underline; text-underline-offset: 3px; }
  .tok.ro { padding-right: 10px; }
  .roh { font-size: 12px; color: var(--ink-muted); }

  /* KPI lens */
  .lens { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--white); border-radius: 14px; box-shadow: var(--shadow-1); position: relative; z-index: 1; }
  .lt { all: unset; box-sizing: border-box; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px 14px; min-width: 0; box-shadow: inset -1px 0 0 var(--line); }
  .lt:first-child { border-radius: 14px 0 0 14px; }
  .lt:last-child { border-radius: 0 14px 14px 0; box-shadow: none; }
  .lt:hover { background: var(--navy-25); }
  .lt .ln { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
  .lt .lq { font-size: 12px; line-height: 1.4; color: var(--ink-muted); }
  .lt .lrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .lt .lv { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .lt .lv small { font-size: 14px; font-weight: 600; margin-left: 1px; letter-spacing: 0; }
  .lt .spark { width: 72px; height: 28px; }
  .lt .dlt { align-self: flex-start; margin-top: 8px; }
  .lt.on { background: var(--navy); color: #fff; box-shadow: none; }
  .lt.on .lq { color: rgba(255,255,255,.72); }
  .lt.on .spark .ln { stroke: var(--sky); }
  .lt.on .spark .ar { fill: rgba(170,202,230,.18); }
  .lt.on .spark .pt { fill: #fff; }
  .lt.on .dlt { background: var(--white); }
  .lt.on::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--sky); border-radius: inherit; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .lt.on::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--navy); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  @container (max-width: 640px) { .lens { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lt { box-shadow: inset 0 -1px 0 var(--line), inset -1px 0 0 var(--line); } .lt.on::after { display: none; } }

  /* hero */
  .hero { display: grid; grid-template-columns: minmax(210px, 280px) minmax(0, 1fr); gap: 16px 32px; padding: 22px 24px 20px; }
  @container (max-width: 600px) { .hero { grid-template-columns: minmax(0, 1fr); } }
  .hero-k { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .eb { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-muted); }
  .hv { font-size: 56px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; color: var(--navy); }
  .hv small { font-size: 22px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
  .hv.neg { color: var(--ink); font-size: 32px; }
  .hv.neg small { font-size: 15px; }
  .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); }
  .frac { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .frac dt { font-size: 12px; color: var(--ink-muted); }
  .frac dd { margin: 2px 0 0; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .standing { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); background: var(--navy-25); border-radius: 8px; padding: 8px 10px; }
  .standing b { color: var(--navy); }
  .basis { margin: 0; font-size: 11px; line-height: 1.55; color: var(--ink-muted); }
  .hero-c { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .hero-c .ch-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .hero-c h3 { margin: 0; font-size: 13px; font-weight: 700; }
  .twin-row { display: flex; gap: 24px; }
  .twin-row > div { display: flex; flex-direction: column; gap: 8px; }

  /* card bits */
  .card-b { padding: 0 24px 20px; }
  .card-f { padding: 10px 24px 14px; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.55; color: var(--ink-muted); display: flex; flex-direction: column; gap: 2px; }
  .card-h .sub2 { width: 100%; margin-top: -4px; font-size: 12px; color: var(--ink-muted); }
  .tvb { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; }
  .tvb:hover, .tvb[aria-pressed="true"] { color: var(--navy); background: var(--navy-tint); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @container (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 16px 0 -4px; }
  .sh h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sh p { margin: 0; font-size: 12px; color: var(--ink-muted); }
  .stale { transition: opacity .2s; }
  .pending .stale { opacity: .55; }
  .seg2 { display: inline-flex; padding: 2px; background: var(--sand-inset); border-radius: 8px; }
  .seg2 button { all: unset; cursor: pointer; height: 26px; line-height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--ink-muted); }
  .seg2 button.on { background: var(--white); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-1); }
  .sw { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .sw i { width: 30px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; transition: background .15s; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform .15s var(--ease); }
  .sw[aria-checked="true"] i { background: var(--navy); }
  .sw[aria-checked="true"] i::after { transform: translateX(12px); }
  .iw { position: relative; display: inline-flex; vertical-align: middle; }
  .iw .info { color: var(--ink-muted); }
  .iw .tip { left: -8px; top: calc(100% + 6px); width: 340px; text-transform: none; letter-spacing: 0; white-space: normal; text-align: left; }
  .iw .tip.tr { left: auto; right: -8px; }
  .iw:hover .tip, .iw:focus-within .tip { display: block; }
  .lt.on .iw .info { color: rgba(255,255,255,.8); }
  .degr { margin: 0 24px 20px; padding: 12px 14px; border-radius: 10px; background: var(--sand-light); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
  .degr .i { color: var(--ink-muted); margin-top: 1px; }

  /* legends + compare picker */
  .lg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
  .lg .k { all: unset; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button.k { cursor: pointer; border-radius: 4px; padding: 1px 4px; margin: 0 -4px; }
  button.k:hover, button.k:focus-visible { background: var(--sand-light); }
  .k .ln { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  .k .sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .k .ln.thin { height: 2px; opacity: .9; }
  .cmpbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; position: relative; }
  .cmpbar > .lab { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-right: 2px; }
  .cchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 8px; border-radius: 13px; background: var(--white); box-shadow: inset 0 0 0 1px var(--line-2); font-size: 12px; font-weight: 600; }
  .cchip i { width: 8px; height: 8px; border-radius: 50%; }
  .cchip button { all: unset; cursor: pointer; width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-muted); }
  .cchip button:hover { background: var(--sand-inset); color: var(--ink); }
  .cadd { all: unset; cursor: pointer; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 600; color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy-300); display: inline-flex; align-items: center; gap: 4px; }
  .cadd:hover { background: var(--navy-25); }
  .cadd[aria-disabled="true"] { color: var(--ink-muted); box-shadow: inset 0 0 0 1px var(--line-2); cursor: default; }
  .pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; width: 260px; background: var(--white); border-radius: 12px; box-shadow: var(--shadow-3), 0 0 0 1px var(--line); padding: 8px; }
  .pop .finwrap { margin: 0 0 6px; }
  .pop .lst { max-height: 260px; overflow: auto; }
  .pop .ph2 { padding: 4px 8px 6px; font-size: 11px; color: var(--ink-muted); }

  /* ranked bars */
  .rk-h, .rk-r { display: grid; grid-template-columns: 26px minmax(118px, 1.1fr) minmax(70px, 1.5fr) 62px 80px 72px 88px; align-items: center; gap: 10px; padding: 0 24px; }
  .rk-h { height: 34px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--ink-muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .rk-h .r, .rk-r .r { text-align: right; justify-self: end; }
  .rk-r { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 26px minmax(118px, 1.1fr) minmax(70px, 1.5fr) 62px 80px 72px 88px; align-items: center; gap: 10px; padding: 0 24px; width: 100%; min-height: 42px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .rk-r:hover { background: var(--navy-25); }
  .rk-r:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
  .rk-r.own { background: linear-gradient(90deg, rgba(0,44,95,.06), rgba(0,44,95,0) 70%); }
  .rk-r.own .nm b { color: var(--navy); }
  .rk-r .no { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .rk-r .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rk-r .nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-r .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .rk-r .spark { height: 26px; }
  .rk-r .spark .ln { stroke: var(--ink-faint); stroke-width: 1.5; }
  .rk-r .spark .ar { fill: transparent; }
  .rk-r .spark .pt { fill: var(--ink-faint); }
  .rk-r.own .spark .ln { stroke: var(--navy); stroke-width: 2; }
  .rk-r.own .spark .pt { fill: var(--navy); }
  .own-b { font-size: 11px; font-weight: 700; color: var(--navy); background: var(--navy-tint); padding: 0 6px; border-radius: 4px; flex-shrink: 0; }
  .sel { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .sel.on { box-shadow: 0 0 0 2px var(--white); }
  .bt { height: 10px; background: var(--sand-light); border-radius: 0 4px 4px 0; position: relative; }
  .bt i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--ctx); transition: width .25s var(--ease); }
  .gap { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
  .gap.good { color: var(--good-ink); }
  .gap.bad { color: var(--bad-ink); }
  @container (max-width: 760px) { .rk-h, .rk-r { grid-template-columns: 26px minmax(132px, 1.3fr) minmax(50px, 1fr) 60px 72px 84px; } .rk-h .c-sp, .rk-r .c-sp { display: none; } }

  /* small multiples */
  .smx { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
  .smx > div { padding: 16px 24px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .smx > div + div { box-shadow: inset 1px 0 0 var(--line); }
  .smx h4 { margin: 0; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .duo { display: flex; align-items: flex-end; gap: 16px; }
  .duo .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .duo .v small { font-size: 12px; font-weight: 600; }
  .duo .v.own { color: var(--navy); }
  .duo .l { font-size: 11px; color: var(--ink-muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .duo .vs { padding-bottom: 6px; font-size: 12px; color: var(--ink-muted); }

  /* type rows / stacked rows */
  .tr-h, .tr-r { display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px 70px 76px; align-items: center; gap: 10px; padding: 0 24px; }
  .tr-h { height: 32px; font-size: 12px; font-weight: 600; color: var(--ink-muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tr-r { min-height: 44px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .tr-r:last-child { border-bottom: 0; }
  .tr-r .t { font-weight: 600; }
  .tr-r .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .tr-r .spark { height: 24px; }
  .tr-h .r { text-align: right; }
  .tr-r.all .t, .tr-r.all .v { color: var(--navy); }
  .stk { display: flex; gap: 2px; height: 14px; }
  .stk i { display: block; height: 100%; min-width: 2px; }
  .stk i:first-child { border-radius: 4px 0 0 4px; }
  .stk i:last-child { border-radius: 0 4px 4px 0; }
  .stk i:only-child { border-radius: 4px; }
  .stk.big { height: 40px; }
  .stk.big i { position: relative; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 700; font-style: normal; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .stk.big i > span { flex-shrink: 0; }
  .stk.big i.dk { color: #fff; }
  .stk.big i.lt2 { color: var(--ink); }
  .stk.big i:hover { filter: brightness(1.06); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  .stk.big i[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
  .str { display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px; align-items: center; gap: 12px; min-height: 36px; font-size: 13px; }
  .str .t { font-weight: 600; }
  .str .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .str.all .t { color: var(--navy); }
  .strs { display: flex; flex-direction: column; gap: 2px; padding: 4px 24px 16px; }

  /* sentiment stats */
  .sstat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
  .sstat button { all: unset; box-sizing: border-box; cursor: pointer; padding: 14px 24px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset -1px 0 0 var(--line); }
  .sstat button:last-child { box-shadow: none; }
  .sstat button:hover { background: var(--navy-25); }
  .sstat .k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .sstat .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .sstat .n { font-size: 12px; color: var(--ink-muted); }
  .sstat .go2 { font-size: 12px; font-weight: 600; color: var(--navy); display: inline-flex; align-items: center; gap: 2px; }
  @container (max-width: 700px) { .sstat { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* position track */
  .trk { padding: 4px 0 0; }

  /* tables */
  .tool { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 0 24px 12px; }
  .tool .finwrap { margin: 0; width: 240px; }
  .tool .cnt2 { font-size: 12px; color: var(--ink-muted); }
  .tool .rr { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  th button.srt { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  th button.srt:hover { color: var(--ink); }
  th button.srt .i { width: 12px; height: 12px; opacity: 0; }
  th button.srt[aria-sort] .i { opacity: 1; color: var(--navy); }
  th .iw { margin-left: 4px; }
  th .iw .info { color: var(--ink-faint); }
  tr.clk { cursor: pointer; }
  tr.clk:hover td { background: var(--navy-25); }
  tr.clk:focus-visible td { background: var(--navy-25); box-shadow: inset 0 1px 0 var(--navy-300), inset 0 -1px 0 var(--navy-300); outline: none; }
  tr.own td:first-child { box-shadow: inset 3px 0 0 var(--navy); }
  .cellbar { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 8px; }
  .cellbar b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cellbar .bt { height: 8px; }
  .cellbar .bt i { background: var(--navy-300); }
  tr.own .cellbar .bt i { background: var(--navy); }
  td .bn { display: flex; align-items: center; gap: 8px; min-width: 0; }
  td .bn b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { display: flex; justify-content: center; padding: 12px; border-top: 1px solid var(--line); }
  .trunc { font-size: 11px; color: var(--ink-muted); padding: 0 24px 14px; }
  .cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .cat i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .hmgb { font-size: 10px; font-weight: 800; letter-spacing: .03em; color: #fff; background: var(--navy); border-radius: 4px; padding: 1px 5px; flex-shrink: 0; }
  .eng { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .eng span { font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--sand-inset); border-radius: 4px; padding: 0 6px; }
  .fun { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .top3 { font-size: 10px; font-weight: 800; color: var(--navy); background: var(--navy-tint); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .twin { overflow-x: auto; }
  .twin table th:first-child, .twin table td:first-child { padding-left: 0; }
  .twin table { table-layout: auto; }
  .twin td, .twin th { font-size: 12px; white-space: nowrap; }

  /* citation hero */
  .ch { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(220px, 1.1fr); gap: 0; }
  .ch > div { padding: 20px 24px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .ch > div + div { box-shadow: inset 1px 0 0 var(--line); }
  @container (max-width: 860px) { .ch { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .ch > div:last-child { grid-column: 1 / -1; box-shadow: inset 0 1px 0 var(--line); } }
  .hv.md { font-size: 40px; color: var(--ink); }
  .hv.md small { font-size: 18px; }
  .ptile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 10px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); }
  .ptile:hover { box-shadow: inset 0 0 0 1.5px var(--navy); background: var(--navy-25); }
  .ptile .t { font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .ptile .n { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; grid-row: 2; }
  .ptile .n small { font-size: 12px; font-weight: 600; }
  .ptile .i { grid-row: 1 / span 2; grid-column: 2; color: var(--navy); }
  .ptile[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
  .ptile[aria-disabled="true"]:hover { box-shadow: inset 0 0 0 1px var(--line-2); background: none; }
  .spec { padding: 0 24px 18px; display: flex; flex-direction: column; gap: 10px; }
  .spec .cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-muted); }
  .spec .cap b { color: var(--ink-2); }
  .kv2 { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--ink-muted); }
  .kv2 b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .catl { display: flex; flex-direction: column; }
  .catr { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(118px, 150px) minmax(40px, 1fr) 54px 50px 70px; align-items: center; gap: 10px; min-height: 34px; padding: 0 24px; font-size: 13px; }
  .catr:hover { background: var(--navy-25); }
  .catr[aria-pressed="true"] { background: var(--navy-25); box-shadow: inset 3px 0 0 var(--navy); }
  .catr .bt { height: 8px; }
  .catr .bt i { background: var(--navy-300); }
  .catr.hmg .bt i { background: var(--navy); }
  .catr .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .catr .s2 { text-align: right; color: var(--ink-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .catr.off { opacity: .45; }
  .tone { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .tone > div { padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 10px; }
  .tone > div + div { box-shadow: inset 1px 0 0 var(--line); }
  .tone .tt2 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .tone .tt2 i { width: 10px; height: 10px; border-radius: 50%; }
  .tone ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .tone li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 12px; }
  .tone li span:last-child { color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  /* drawer */
  .scrim { position: fixed; inset: 0; z-index: 140; background: rgba(10,9,8,.28); }
  .scrim.anim { animation: fade .18s; }
  @keyframes fade { from { opacity: 0; } }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 150; width: min(640px, 94vw); background: var(--white); box-shadow: var(--shadow-3); display: flex; flex-direction: column; }
  .drawer.anim { animation: din .22s var(--ease); }
  .drawer.wide { width: min(920px, 96vw); }
  @keyframes din { from { transform: translateX(28px); opacity: 0; } }
  .dh { padding: 18px 24px 0; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
  .dh .top { display: flex; align-items: flex-start; gap: 12px; }
  .dh .top > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .dh .ey { font-size: 12px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .dh h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dh .ds { font-size: 12px; color: var(--ink-muted); }
  .dstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 0 -24px; border-top: 1px solid var(--line); }
  .dstats div { padding: 10px 24px; box-shadow: inset -1px 0 0 var(--line); }
  .dstats div:last-child { box-shadow: none; }
  .dstats dt { font-size: 11px; color: var(--ink-muted); }
  .dstats dd { margin: 2px 0 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .dtabs { display: flex; gap: 4px; margin: 0 -8px; }
  .dtabs button { all: unset; cursor: pointer; padding: 10px 10px 12px; font-size: 13px; font-weight: 600; color: var(--ink-muted); box-shadow: inset 0 -2px 0 transparent; }
  .dtabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--navy); }
  .dtabs button .c2 { font-weight: 500; color: var(--ink-muted); margin-left: 4px; }
  .db { flex: 1; overflow: auto; padding: 14px 24px 32px; overscroll-behavior: contain; }
  .db table th:first-child, .db table td:first-child { padding-left: 0; }
  .db table th:last-child, .db table td:last-child { padding-right: 0; }
  .db .cap2 { font-size: 12px; color: var(--ink-muted); margin: 0 0 10px; }
  .dmix { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 0 0 14px; }
  .dmix h5 { margin: 0 0 6px; font-size: 11px; font-weight: 700; color: var(--ink-muted); }
  .dmix .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .dmix .chips span { font-size: 11px; color: var(--ink-2); background: var(--sand-light); border-radius: 4px; padding: 1px 6px; }
  .dmix .chips b { font-weight: 700; margin-left: 4px; }
  .url { font-family: var(--mono); font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .crumbs { display: flex; align-items: center; gap: 6px; }

  /* answer */
  .aq { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--sand-light); font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--ink); }
  .ameta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); padding-bottom: 12px; }
  .stance { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .stance .st { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; background: var(--sand-light); font-weight: 600; color: var(--ink-2); }
  .stance .st i { width: 8px; height: 8px; border-radius: 50%; }
  .ans-g { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 24px; }
  @media (max-width: 900px) { .ans-g { grid-template-columns: minmax(0, 1fr); } }
  .ans { font-size: 14px; line-height: 1.8; color: var(--ink-2); }
  .ans h4 { margin: 0 0 8px; font-size: 16px; color: var(--ink); }
  .ans ol { margin: 8px 0; padding-left: 20px; }
  .ans li { margin: 6px 0; }
  .ans p { margin: 8px 0; }
  .ans mark { border-radius: 3px; padding: 0 2px; }
  .ans mark.b { background: rgba(0,44,95,.10); color: var(--navy); font-weight: 700; }
  .ans mark.b.cp { background: rgba(235,104,52,.14); color: #8f3a14; }
  .ans mark.m { background: rgba(170,202,230,.55); color: var(--ink); }
  .ans .sp, .ans .sn { text-decoration-line: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .ans .sp { text-decoration-color: var(--pos); }
  .ans .sn { text-decoration-color: var(--neg); text-decoration-style: wavy; }
  .ans.no-b mark.b, .ans.no-m mark.m { background: none; color: inherit; font-weight: inherit; }
  .ans.no-s .sp, .ans.no-s .sn { text-decoration: none; }
  .aside { display: flex; flex-direction: column; gap: 16px; font-size: 12px; }
  .aside h5 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--ink-muted); }
  .aside .grp2 { font-size: 11px; color: var(--ink-muted); margin: 6px 0 2px; }
  .aside .mc { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .aside .mc b { font-variant-numeric: tabular-nums; }
  .aside .srcs { display: flex; flex-direction: column; gap: 8px; }
  .aside .srcs a { display: flex; flex-direction: column; gap: 2px; color: inherit; text-decoration: none; padding: 6px 8px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
  .aside .srcs a.hit { box-shadow: inset 0 0 0 1.5px var(--navy); background: var(--navy-25); }
  .hlg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-muted); }
  .hlg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; color: var(--ink-2); }
  .hlg button[aria-pressed="false"] { opacity: .5; }
  .hlg .sw1 { width: 14px; height: 10px; border-radius: 2px; }

  /* sub pages */
  .ltabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 24px; }
  .ltabs button { all: unset; cursor: pointer; padding: 14px 6px 12px; margin-right: 10px; font-size: 13px; font-weight: 600; color: var(--ink-muted); box-shadow: inset 0 -2px 0 transparent; }
  .ltabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--navy); }
  .ltabs .i { vertical-align: -3px; margin-right: 4px; }
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted); }
  .pager .pg { display: flex; align-items: center; gap: 6px; }
  .urow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .urow .ut { font-size: 13px; font-weight: 600; color: var(--ink); }
  .urow .um { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .urow .uc { grid-row: 1 / span 3; grid-column: 2; align-self: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dgrp { padding: 10px 24px 6px; background: var(--sand-light); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
  .dgrp span { font-weight: 500; color: var(--ink-muted); }

  /* tooltip */
  .ttip { position: fixed; z-index: 220; pointer-events: none; min-width: 150px; max-width: 280px; background: var(--white); border-radius: 10px; box-shadow: var(--shadow-3), 0 0 0 1px var(--line); padding: 9px 11px; font-size: 12px; }
  .ttip h5 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--ink-muted); }
  .ttip .r { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: center; gap: 6px; line-height: 1.6; }
  .ttip .r i { width: 12px; height: 2px; border-radius: 1px; }
  .ttip .r i.sq { height: 8px; width: 8px; border-radius: 2px; }
  .ttip .r b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ttip .r span { color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ttip .r.em span { color: var(--ink); font-weight: 600; }
  .ttip p { margin: 0; color: var(--ink-2); line-height: 1.5; white-space: pre-line; }

  /* chart svg */
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; overflow: visible; }
  .chart .gl { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .bl { stroke: var(--line-2); stroke-width: 1; shape-rendering: crispEdges; }
  .chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .chart text.dl { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
  .chart text.dl.own { fill: var(--navy); font-weight: 700; }
  .chart text.tk { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
  .chart .s { transition: opacity .15s; }
  .chart.fading .s { opacity: .12; }
  .chart.fading .s.on { opacity: 1; }
  .chart .xh { stroke: var(--ink-faint); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .col { cursor: pointer; }
  .chart .col:hover rect, .chart .col:hover path { filter: brightness(1.08); }
  .chart .dotg circle { stroke: #fff; stroke-width: 2; }

  /* review notes sheet */
  .notes { position: fixed; top: var(--mk-h, 0px); right: 0; bottom: 0; z-index: 160; width: min(520px, 96vw); background: #1c1f24; color: #e6e8eb; padding: 18px 20px 32px; overflow: auto; box-shadow: var(--shadow-3); font-size: 12px; line-height: 1.6; }
  .notes h3 { margin: 0 0 4px; font-size: 14px; color: #fff; }
  .notes .nsub { margin: 0 0 14px; color: #9aa3ad; }
  .notes ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 10px; }
  .notes li b { color: #fff; }
  .notes .tag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
  .notes .tag.ux { background: #f4c542; color: #1c1f24; }
  .notes .tag.data { background: #ec835a; color: #1c1f24; }
  .notes .tag.same { background: #3a414b; color: #e6e8eb; }
  .notes code { font-family: var(--mono); font-size: 11px; color: #fff; }

  .tn.dis .lab, .tn.dis .cb { opacity: .5; }
  /* wide tables keep their columns and scroll inside the card when the content column is narrow */
  table.btbl { min-width: 780px; }
  table.dtbl { min-width: 700px; }
  /* parent-group treemap (브랜드 언급 구성) */
  .tm { position: relative; }
  .tmt { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; border-radius: 4px; padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; overflow: hidden; font-size: 12px; line-height: 1.3; transition: opacity .15s, box-shadow .12s; }
  .tmt b { font-weight: 700; font-size: 13px; white-space: nowrap; }
  .tmt span { font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tmt:hover, .tmt:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); outline: none; z-index: 1; }
  .tmt.dim { opacity: .22; }
  .bn .grpn { font-size: 11px; color: var(--ink-muted); white-space: nowrap; }

function trendRounds(f) {
  const t = f.time;
  const rs = t ? ROUND_DATES.filter((d) => (!t.from || d >= t.from) && (!t.to || d <= t.to)) : ROUND_DATES.slice(-12);
  return rs.length ? rs : [LATEST_ROUND];
}
function asOfDay() {
  const t = S.f.time;
  if (!t) return LATEST_ROUND;
  const inRange = ROUND_DATES.filter((d) => (!t.from || d >= t.from) && (!t.to || d <= t.to));
  return inRange.length ? inRange[inRange.length - 1] : null;
}
const ownBrandsOf = (f) => (role.scope.all ? (f.brand.length ? f.brand : OWN_ALL) : role.scope.brands);
const ownLabelOf = (f) => (role.scope.all ? (f.brand.length ? f.brand.join(", ") : "HMG") : role.scope.brands.join(", "));
// a series of n points that ends at `end`; `vol` = step size
function walk(end, n, vol, lo, hi, ...key) {
  const s = new Array(n); s[n - 1] = end;
  for (let i = n - 2; i >= 0; i--) s[i] = clamp(s[i + 1] - (rnd(...key, i) - 0.5) * vol, lo, hi);
  return s;
}
const lastDelta = (s) => (s.length > 1 ? s[s.length - 1] - s[s.length - 2] : null);

function compute(f) {
  const d = derive(f), ctx = role.id + ser({ ...f, source: [], competitor: [] });
  const rounds = trendRounds(f), n = rounds.length;
  const x = rounds.map((r) => `${+r.slice(5, 7)}/${+r.slice(8, 10)}`);
  let codes = d.geoOpts.filter((c) => !VIRTUAL_GEO_CODES.has(c));
  if (f.geography.length) codes = codes.filter((c) => f.geography.includes(c));
  const engines = ENGINE_ORDER.filter((e) => !f.engine.length || f.engine.includes(e));
  const narrow = (f.promptContext.length ? f.promptContext.length / 3 : 1) * (f.brandPresence.length === 1 ? 0.55 : 1) * (f.listType.length || f.depth1.length ? 0.4 : 1) * (f.language.length ? 0.6 : 1);
  const scale = Math.max(0.03, Math.min(1, codes.length / 40)) * (engines.length / 2) * narrow;
  const own = ownBrandsOf(f);
  const empty = codes.length === 0 || dataState === "empty";
  return { x, rounds, n, engines, scale, empty, own, ownLabel: ownLabelOf(f), m: mentionData(ctx, n, scale, own, engines), c: citationData(ctx, f, n, scale, engines) };
}

function mentionData(ctx, n, scale, own, engines) {
  const answers = Math.max(40, Math.round(6270 * scale));
  // 당사 = the scope's brands combined: an answer mentions at least one of them
  const ownStr = 1 - own.reduce((p, b) => p * (1 - 0.75 * (OWN_STR[b] ?? 0.5)), 1);
  const comps = COMPETITORS.map((b, i) => ({ b, s: Math.max(0.03, 0.8 * Math.pow(0.9, i)) * (0.8 + 0.4 * rnd(ctx, b)) })).sort((a, b) => b.s - a.s);
  const expOf = (s) => clamp(62 * s + 0.6, 0.3, 92);
  const ownExp = clamp(12 + 56 * ownStr + (rnd(ctx, "oe") - 0.5) * 8, 4, 90);
  // mention weights → share of voice
  const w = new Map([["__own", ownExp * 3.4], ...comps.map((c) => [c.b, expOf(c.s) * (1.1 + 0.5 * rnd(ctx, c.b, "w"))])]);
  const wsum = sumOf([...w.values()]);
  const sovOf = (k) => (w.get(k) / wsum) * 100;
  const posOf = (s, k) => clamp(1.3 + (1 - Math.min(1, s)) * 3.6 + (rnd(ctx, k, "p") - 0.5) * 0.7, 1, 6.5);
  const mk = (key, v, vol, lo, hi) => { const series = walk(v, n, vol, lo, hi, ctx, key); return { v, series, d: lastDelta(series) }; };
  const ownPos = clamp(1.5 + (1 - ownStr) * 2.6 + (rnd(ctx, "op") - 0.5) * 0.5, 1, 5);
  const top = comps.slice(0, 12);
  const board = {
    exposure: [{ b: "__own", own: true, ...mk("e-own", ownExp, 3.2, 0, 100) }, ...top.map((c) => ({ b: c.b, ...mk("e" + c.b, expOf(c.s), 3, 0, 100) }))],
    sov: [{ b: "__own", own: true, ...mk("s-own", sovOf("__own"), 1.6, 0, 100) }, ...top.map((c) => ({ b: c.b, ...mk("s" + c.b, sovOf(c.b), 1.2, 0, 100) }))],
    "first-rank": [{ b: "__own", own: true, ...mk("p-own", ownPos, 0.35, 1, 7) }, ...top.slice(0, 8).map((c) => ({ b: c.b, ...mk("p" + c.b, posOf(c.s, c.b), 0.3, 1, 7) }))],
  };
  for (const k of ["exposure", "sov"]) board[k].sort((a, b) => b.v - a.v);
  board["first-rank"].sort((a, b) => a.v - b.v);
  const favPos = clamp(60 + 22 * rnd(ctx, "fp"), 30, 95), favNeg = clamp(3 + 9 * rnd(ctx, "fn"), 0.5, 30);
  const fav = { pos: mk("fav+", favPos, 3, 0, 100), neg: mk("fav-", favNeg, 1.4, 0, 100) };
  const ownMentions = Math.round(answers * ownExp / 100 * 1.6);
  const signals = Math.round(ownMentions * 0.85);
  const mixP = 5 + 5 * rnd(ctx, "mix"), neuP = Math.max(2, 100 - favPos - favNeg - mixP);
  const dist = { positive: favPos, neutral: neuP, mixed: mixP, negative: favNeg };
  const distN = Object.fromEntries(Object.entries(dist).map(([k, v]) => [k, Math.round(signals * v / 100)]));
  const TR = { mention: 0.92, recommendation: 0.52, comparison: 0.44, definition: 0.22, final_choice: 0.13 };
  const types = TYPES.map(([t, name]) => {
    const e = clamp(ownExp * TR[t] * (0.85 + 0.3 * rnd(ctx, t)), 0.5, 99), sovT = clamp(sovOf("__own") * (0.7 + 0.7 * rnd(ctx, t, "s")), 1, 80);
    const sigs = Math.round(answers * TR[t] * 0.6 * (0.8 + 0.4 * rnd(ctx, t, "n")));
    // composition inside the type (own · compare brands · the rest): filled per compare set at render time
    const ownShare = clamp(sovT, 2, 70);
    const fp = clamp(favPos + (rnd(ctx, t, "f") - 0.5) * 24, 20, 98), fn = clamp(favNeg * (0.4 + 1.4 * rnd(ctx, t, "g")), 0.3, 40), fm = 4 + 6 * rnd(ctx, t, "m");
    return { t, name, sigs, ownShare, exposure: mk("te" + t, e, 3.4, 0, 100), sov: mk("ts" + t, sovT, 2.2, 0, 100), fav: { positive: fp, mixed: fm, negative: fn, neutral: Math.max(1, 100 - fp - fn - fm) } };
  });
  const engineRows = engines.map((e) => {
    const o = clamp(ownExp * (0.82 + 0.36 * rnd(ctx, e)), 0, 100), a = clamp(sumOf(top.slice(0, 5).map((c) => expOf(c.s))) / 5 * (0.8 + 0.4 * rnd(ctx, e, "a")), 0, 100);
    const so = clamp(sovOf("__own") * (0.8 + 0.4 * rnd(ctx, e, "s")), 0, 100), sa = clamp(sumOf(top.slice(0, 5).map((c) => sovOf(c.b))) / 5 * (0.8 + 0.4 * rnd(ctx, e, "t")), 0, 100);
    return { e, exposure: { own: mk("eo" + e, o, 3, 0, 100), avg: mk("ea" + e, a, 2.4, 0, 100) }, sov: { own: mk("so" + e, so, 1.6, 0, 100), avg: mk("sa" + e, sa, 1, 0, 100) } };
  });
  // 주별 브랜드 언급 수 (당사 + 상위 10) and the top-100 table
  const mentionsOf = (k, e) => Math.round(answers * e / 100 * (1.25 + 0.6 * rnd(ctx, k, "m")) * n / 4);
  const ownRows = own.map((b) => { const e = clamp(ownExp * (OWN_STR[b] ?? 0.5) / Math.max(...own.map((x) => OWN_STR[x] ?? 0.5)) * (own.length > 1 ? 0.82 : 1), 0, 100); return { b, own: true, e, s: OWN_STR[b] ?? 0.5 }; });
  const table = [...ownRows, ...comps.map((c) => ({ b: c.b, own: false, e: expOf(c.s), s: c.s }))].map((r) => {
    const m = mentionsOf(r.b, r.e), multiN = Math.round(m * (0.18 + 0.2 * rnd(ctx, r.b, "mm")));
    return { b: r.b, own: r.own, mentions: m, position: r.own ? clamp(ownPos * (0.9 + 0.25 * rnd(ctx, r.b)), 1, 6) : posOf(r.s, r.b), prompts: Math.max(1, Math.round(250 * Math.min(1, r.e / 70) * (0.7 + 0.3 * rnd(ctx, r.b, "pr")) * Math.min(1, scale * 3))), rate: r.e, multi: multiN, multiRate: r.e * (0.16 + 0.18 * rnd(ctx, r.b, "mr")) };
  }).sort((a, b) => b.mentions - a.mentions);
  const tsum = sumOf(table.map((r) => r.mentions)), msum = sumOf(table.map((r) => r.multi));
  table.forEach((r, i) => { r.rank = i + 1; r.share = r.mentions / tsum * 100; r.multiShare = r.multi / msum * 100; });
  // 점유율 증감 vs the previous round (pp) — null when the window has a single round
  for (const [k, s] of [["dShare", "share"], ["dMultiShare", "multiShare"]]) {
    const raw = table.map((r) => (rnd(ctx, r.b, k) - 0.5) * (0.3 + r[s] * 0.22)), rs = sumOf(raw);
    table.forEach((r, i) => { r[k] = n > 1 ? raw[i] - (rs * r[s]) / 100 : null; });
  }
  const weeklyKeys = [...table.filter((r) => r.own).slice(0, 1).map(() => "__own"), ...table.filter((r) => !r.own).slice(0, 10).map((r) => r.b)];
  const weekly = weeklyKeys.map((k) => {
    const base = k === "__own" ? sumOf(table.filter((r) => r.own).map((r) => r.mentions)) / n : table.find((r) => r.b === k).mentions / n;
    return { key: k, values: walk(base, n, base * 0.22, 0, 1e9, ctx, "wk", k).map((v) => Math.round(v)) };
  });
  // the 11 lines cover this fraction of all brand mentions; the rest of the market fills the weekly total
  const topFrac = sumOf(weeklyKeys.map((k) => (k === "__own" ? sumOf(table.filter((r) => r.own).map((r) => r.mentions)) : table.find((r) => r.b === k).mentions))) / tsum;
  for (let i = 0; i < n; i++) { const tot = sumOf(weekly.map((w) => w.values[i])) / topFrac; weekly.forEach((w) => ((w.shares ||= [])[i] = (w.values[i] / tot) * 100)); }
  const lensVal = { exposure: board.exposure.find((r) => r.own), sov: board.sov.find((r) => r.own), favorability: fav.pos, "first-rank": board["first-rank"].find((r) => r.own) };
  return {
    answers, ownMentions, comps: top.map((c) => c.b), board, fav, dist, distN, signals, types, engineRows, table, weekly, lens: lensVal,
    ranked: Math.round(answers * ownExp / 100), measuredDays: 2 + Math.floor(3 * rnd(ctx, "days")),
    hero: {
      exposure: { num: Math.round(answers * ownExp / 100), den: answers },
      sov: { num: ownMentions, den: Math.round(ownMentions / (sovOf("__own") / 100)) },
    },
  };
}

function citationData(ctx, f, n, scale, engines) {
  const W0 = { [OFFICIAL_HMG]: 0.17, [OFFICIAL_COMPETITOR]: 0.12, [DEALER]: 0.11, "Automotive Media": 0.22, "News & Media": 0.1, "Community & Forums": 0.08, "Social & Video": 0.05, "Blogs & Reviews": 0.05, "Wiki & Reference": 0.04, "Government & Public": 0.02, "Award & Certification": 0.02, "Academic & Research": 0.006, Other: 0.014 };
  const allowed = new Set(f.source.length ? f.source : CATS);
  const compDomains = DIMENSIONS.competitor;
  const compPick = f.competitor.length && competitorEnabled(f.source) ? f.competitor : null;
  const domainW = (dm, cat, i) => Math.pow(0.62, i) * (0.7 + 0.6 * rnd(ctx, dm));
  const catW = Object.fromEntries(CATS.map((c) => [c, allowed.has(c) ? W0[c] * (0.8 + 0.4 * rnd(ctx, c)) : 0]));
  if (compPick) { const ds = DOMAINS.filter(([, c]) => c === OFFICIAL_COMPETITOR); const all = sumOf(ds.map(([dm], i) => domainW(dm, OFFICIAL_COMPETITOR, i))); const sel = sumOf(ds.map(([dm], i) => (compPick.includes(dm) ? domainW(dm, OFFICIAL_COMPETITOR, i) : 0))); catW[OFFICIAL_COMPETITOR] *= sel / all; }
  const wsum = sumOf(Object.values(catW)) || 1;
  const fullTotal = Math.max(30, Math.round(24812 * scale));
  const total = Math.max(1, Math.round(fullTotal * wsum / sumOf(Object.values(W0))));
  const cats = CATS.map((c) => ({ c, count: Math.round(total * catW[c] / wsum), share: catW[c] / wsum * 100, d: allowed.has(c) ? (rnd(ctx, c, "d") - 0.5) * 3 : null })).filter((r) => allowed.has(r.c));
  const shareOf = (c) => cats.find((r) => r.c === c)?.share ?? null;
  const fold = (shares) => { // 6 coloured + 그 외, in taxonomy order
    const out = CATS.filter((c) => CAT_COLOR[c] && allowed.has(c)).map((c) => ({ key: c, name: CAT_KO[c], color: CAT_COLOR[c], v: shares[c] || 0 }));
    const rest = sumOf(CATS.filter((c) => !CAT_COLOR[c] && allowed.has(c)).map((c) => shares[c] || 0));
    if (rest > 0) out.push({ ...FOLD, v: rest });
    const s = sumOf(out.map((o) => o.v)) || 1; out.forEach((o) => (o.v = o.v / s * 100)); return out;
  };
  const jitter = (key) => Object.fromEntries(CATS.map((c) => [c, catW[c] * (0.75 + 0.5 * rnd(ctx, key, c))]));
  const composition = Array.from({ length: n }, (_, i) => fold(jitter("r" + i)));
  const byEngine = engines.map((e) => ({ e, parts: fold(jitter("e" + e)) }));
  const byType = TYPES.map(([t, name]) => ({ t, name, parts: fold(jitter("t" + t)) }));
  // domains: each category's count split over its domains
  const domains = [];
  for (const c of CATS) {
    if (!allowed.has(c)) continue;
    let ds = DOMAINS.filter(([, cc]) => cc === c).map(([dm]) => dm);
    if (c === OFFICIAL_COMPETITOR && compPick) ds = ds.filter((dm) => compPick.includes(dm));
    const ws = ds.map((dm, i) => domainW(dm, c, i)), sw = sumOf(ws) || 1, cnt = cats.find((r) => r.c === c).count;
    ds.forEach((dm, i) => domains.push({ dm, c, citations: Math.max(1, Math.round(cnt * ws[i] / sw)), hmg: c === OFFICIAL_HMG }));
  }

  const M = S.data.m, k = kpi === "sov" ? "sov" : "exposure", list = cmpList();
  const types = TYPE_STRENGTH.map((t) => M.types.find((x) => x.t === t));
  const isCmp = typeMode !== "own", id = `type-${k}`;
  const ownLabel = k === "sov" ? "당사 유형 구성" : "당사 노출률 추이";
  const head = `<div class="card-h"><h2>멘션 유형별 ${k === "sov" ? "점유율" : "노출"}</h2>${noteTip("이 카드가 보여 주는 것", "AI 가 당사를 얼마나가 아니라 어떤 식으로 언급하는지(이름만 · 추천 · 비교 · 정의 · 최종 선택)입니다. 답변 분석기가 브랜드 언급마다 붙이는 유형 신호 기준이며, 한 언급이 여러 유형을 가질 수 있어 유형끼리 더하지 않습니다.", true)}
    <span class="r"><span class="seg2" role="radiogroup" aria-label="보기"><button class="${isCmp ? "on" : ""}" data-tmode="cmp" role="radio" aria-checked="${isCmp}">경쟁 비교</button><button class="${!isCmp ? "on" : ""}" data-tmode="own" role="radio" aria-checked="${!isCmp}">${ownLabel}</button></span>
    ${!isCmp ? `<span class="seg2" role="radiogroup" aria-label="단위"><button class="${typeUnit === "pct" ? "on" : ""}" data-tunit="pct">비율</button><button class="${typeUnit === "count" ? "on" : ""}" data-tunit="count">건수</button></span>` : tvb(id)}</span>
    <span class="sub2">위에서부터 추천 강도 순 — 최종 선택 · 추천에서 앞서는지가 가장 중요합니다.</span></div>`;
  if (!isCmp) {
    const maxV = Math.max(...types.map((t) => (typeUnit === "count" ? t.sigs : t[k].v)));
    return `<section class="card stale" aria-label="멘션 유형">${busy()}${head}
      <div class="tr-h"><span>유형</span><span>${typeUnit === "count" ? "당사 유형 신호 수" : k === "sov" ? "당사 유형 구성" : "당사 노출률"}</span><span class="r">값</span><span class="r">증감</span><span>추이</span></div>
      ${types.map((t) => { const v = typeUnit === "count" ? t.sigs : t[k].v; return `<div class="tr-r"><span class="t">${t.name}</span><span class="bt"><i style="width:${(v / maxV) * 100}%;background:${COL.own}"></i></span><span class="v">${typeUnit === "count" ? `${fmtN(v)}건` : pct(v)}</span><span class="r" style="text-align:right">${typeUnit === "count" ? "" : dchip(t[k].d)}</span><span>${spark(t[k].series)}</span></div>`; }).join("")}
      <div class="card-f"><span>${k === "sov" ? "분모 = 당사 유형 신호 합 (유형 간 구성비)" : "분모 = 전체 답변 수 — 답변 100개 중 당사가 그 유형으로 나온 답변 수"} · 모니터링 답변 수 ${fmtN(M.answers)}</span></div></section>`;
  }
  // 경쟁 비교: one row per type, every brand on the same axis (share inside the type)
  const avgOf = (t) => sumOf(M.comps.slice(0, 5).map((b) => typeShareOf(b, t))) / 5;
  const rows = types.map((t) => {
    const cmpDots = list.map((b) => ({ b, v: typeShareOf(b, t), color: colorOf(b) }));
    const ref = cmpDots.length ? cmpDots.reduce((a, c) => (c.v > a.v ? c : a)) : { b: "경쟁사 평균", v: avgOf(t) };
    return { t, own: t.ownShare, avg: avgOf(t), cmpDots, ref, gap: t.ownShare - ref.v };
  });
  const maxX = niceTicks(0, Math.max(...rows.flatMap((r) => [r.own, r.avg, ...r.cmpDots.map((d) => d.v)])) * 1.08, 4);
  const top = maxX[maxX.length - 1], at = (v) => `${((v / top) * 100).toFixed(2)}%`;
  CH[id] = { type: "dots", rows, label: "멘션 유형별 유형 안 점유율" }; // the table twin reads this
  const legend = `<div class="lg">${[{ name: S.data.ownLabel, color: COL.own, own: true }, ...list.map((b) => ({ name: b, color: colorOf(b) }))].map((s) => `<span class="k"><i class="dt" style="background:${s.color}"></i>${esc(s.name)}${s.own ? `<span class="own-b">당사</span>` : ""}</span>`).join("")}<span class="k"><i class="dm"></i>경쟁사 평균 (상위 5개사)</span></div>`;
  const body = tableView.has(id)
    ? `<div class="twin" style="padding:0 24px"><table><thead><tr><th>유형</th><th class="r">${esc(S.data.ownLabel)}</th>${list.map((b) => `<th class="r">${esc(b)}</th>`).join("")}<th class="r">경쟁사 평균</th><th class="r">차이</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r.t.name}</td><td class="r num">${pct(r.own)}</td>${r.cmpDots.map((d) => `<td class="r num">${pct(d.v)}</td>`).join("")}<td class="r num">${pct(r.avg)}</td><td class="r num">${r.gap >= 0 ? "+" : "−"}${Math.abs(r.gap).toFixed(1)}pp vs ${esc(r.ref.b)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="dp">
      <div class="dp-ax" aria-hidden="true"><span></span><span class="dp-tr">${maxX.map((v) => `<i style="left:${at(v)}">${v}%</i>`).join("")}</span><span></span></div>
      ${rows.map((r) => {
        const lo = Math.min(r.own, r.ref.v), hi = Math.max(r.own, r.ref.v), good = r.gap >= 0;
        const tip = (who, v) => esc(`${r.t.name} · ${who}\n유형 안 점유율 ${v.toFixed(1)}%`);
        return `<div class="dp-r" role="group" aria-label="${esc(`${r.t.name}: 당사 ${r.own.toFixed(1)}%, ${r.ref.b} ${r.ref.v.toFixed(1)}%`)}">
          <span class="t">${r.t.name}</span>
          <span class="dp-tr">${maxX.map((v) => `<b style="left:${at(v)}"></b>`).join("")}
            <span class="dp-gap ${good ? "good" : "bad"}" style="left:${at(lo)};width:calc(${at(hi)} - ${at(lo)})"></span>
            <span class="dp-d dm" style="left:${at(r.avg)}" data-tip="${tip("경쟁사 평균 (상위 5개사)", r.avg)}"></span>
            ${r.cmpDots.map((d) => `<span class="dp-d" style="left:${at(d.v)};background:${d.color}" data-tip="${tip(d.b, d.v)}"></span>`).join("")}
            <span class="dp-d own" style="left:${at(r.own)}" data-tip="${tip(`${S.data.ownLabel} (당사)`, r.own)}"></span><span class="dp-v" style="left:${at(r.own)}" aria-hidden="true">${r.own.toFixed(1)}%</span></span>
          <span class="gap ${good ? "good" : "bad"}">${good ? "+" : "−"}${Math.abs(r.gap).toFixed(1)}pp<small>vs ${esc(r.ref.b)}</small></span></div>`;
      }).join("")}</div>`;
  return `<section class="card stale" aria-label="멘션 유형">${busy()}${head}
    <div style="padding:0 24px 6px">${legend}</div>${body}
    <div class="card-f"><span>유형 안 점유율 = 그 유형의 전 브랜드 신호 중 각 브랜드의 몫(유형 신호 기준, 언급 수 아님). 막대 구간 = 당사와 가장 앞선 비교 브랜드의 차이(녹색 = 당사가 앞섬).</span><span>비교 브랜드는 위 ‘경쟁사 분석’에서 고른 브랜드와 같습니다.</span></div></section>`;
}

    <div class="sstat">${segs.map((s) => `<button data-signal="${s.kk}"><span class="k"><i class="sq" style="width:10px;height:10px;border-radius:2px;background:${s.c}"></i>${s.name}</span><span class="v">${s.v.toFixed(1)}%</span><span class="n">신호 ${fmtN(s.n)}건</span><span class="go2">프롬프트 보기${ic("chev-r", "s12")}</span></button>`).join("")}</div>

function rankBody() {

  const track = { type: "track", items: rows.map((r) => ({ key: r.b, name: brandName(r.b), v: r.v, own: r.own, color: r.own ? COL.own : list.includes(r.b) ? colorOf(r.b) : COL.ctx, emph: r.own || list.includes(r.b) })), label: "브랜드별 평균 위치" };

      <dl class="frac"><div><dt>순위 답변</dt><dd>${fmtN(M.ranked)}개</dd></div><div><dt>당사보다 앞선 브랜드</dt><dd>${better}개</dd></div></dl>

    </div>
    <div class="hero-c"><div class="ch-h"><h3>브랜드별 평균 위치</h3><span class="muted" style="font-size:12px">왼쪽일수록 먼저 언급</span><span style="margin-left:auto">${tvb("rank-track")}</span></div>
      ${chartBox("rank-track", track, 92)}
      <div class="ch-h" style="margin-top:6px"><h3>평균 위치 추이</h3><span style="margin-left:auto">${tvb(id)}</span></div>${legendHtml(spec.series.slice().reverse())}
      ${chartBox(id, spec, 170)}<p class="basis">y축은 1위가 위로 오도록 반전돼 있습니다. 측정 없는 회차는 선이 끊깁니다.</p></div></div>
  </section>
  <section class="card stale" aria-label="순위표">${busy()}
    <div class="card-h"><h2>AI 우선 노출도</h2><span class="hint">각 브랜드가 몇 번째로 언급되는지의 평균</span><span class="r"><button class="sw" role="switch" aria-checked="${ladder}" data-ladder><i></i>순위별 보기</button>${cmpPicker()}</span></div>
    <div class="rk-h"><span>#</span><span>브랜드</span><span>평균 위치 막대</span><span class="r">평균 위치</span><span class="c-sp">추이(주 1회, 총 ${S.data.n}회)</span><span class="r">WoW</span><span class="r">당사 대비</span></div>
    ${shown.map((r) => { const on = list.includes(r.b), color = r.own ? COL.own : on ? colorOf(r.b) : COL.ctx, gap = r.own ? null : r.v - o.v; return `<button class="rk-r ${r.own ? "own" : ""}" ${r.own ? "" : `data-cmpt="${esc(r.b)}" aria-pressed="${on}"`}>

      <span class="bt"><i style="width:${(1 - (r.v - 1) / (maxV)) * 100}%;background:${color}"></i></span><span class="v">${pos(r.v)}</span><span class="c-sp">${spark(r.series, true)}</span><span class="r">${dchip(r.d, { rank: true })}</span>

  </section>`;
}
