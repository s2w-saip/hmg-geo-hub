<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 메뉴 목업 — HMG GEO 리뉴얼</title>
<style>
  @font-face {
    font-family: "Pretendard";
    src: url("../../../front/public/fonts/PretendardVariable.woff2") format("woff2-variations"),
         url("../../../front/public/fonts/PretendardVariable.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  /* Project 메뉴 구성 목업 (2026-11-03). 사이드바는 리뉴얼 구현(rn-sidebar.tsx)과 디자인 규칙 '틀 · 사이드바 메뉴'를 그대로 따릅니다.
     목록의 값은 Gold surface 3(2026-11-03 조회)이고, 이름 · 브랜드 · 국가는 Gold에 없어 비워 둡니다.
     설계하는 동안만 쓰고 구현하면 지웁니다(디자인 규칙 '구현이 기준'). */
  :root {
    --navy: #002c5f; --navy-500: #1a4d8e; --navy-300: #6b89b3; --navy-50: #e6eaf0; --navy-25: #f2f5fd; --navy-tint: rgba(0, 44, 95, .08);
    --sky: #aacae6; --sand-inset: #eee9e2; --sand-light: #f6f3f2; --white: #ffffff;
    --ink: #0a0908; --ink-2: #2b2825; --ink-muted: #6b6660; --ink-faint: #939393; --line: #ece8e3; --line-2: #e2ddd6;
    --font: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
    --shadow-1: 0 1px 2px rgba(10,9,8,.05), 0 1px 3px rgba(10,9,8,.06);
    --shadow-3: 0 24px 56px -16px rgba(10,9,8,.30), 0 6px 16px rgba(10,9,8,.08);
    --shadow-card: 0 1px 2px rgba(10,9,8,.04), 0 0 0 1px var(--line);
    --r-card: 16px; --side-w: 232px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--sand-light); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.s14 { width: 14px; height: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); letter-spacing: -.01em; }
  .muted { color: var(--ink-muted); }

  /* ── 목업 바 ── */
  .mk { position: sticky; top: 0; z-index: 100; background: #1c1f24; color: #e6e8eb; font-size: 12px; }
  .mk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 16px; }
  .mk-tag { background: #f4c542; color: #1c1f24; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .mk-title { font-weight: 600; }
  .mk-group { display: inline-flex; align-items: center; gap: 4px; }
  .mk-group > span { color: #9aa3ad; margin-right: 2px; }
  .mk-btn { border: 1px solid #3a414b; background: transparent; color: #cfd4da; font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
  .mk-btn[aria-pressed="true"] { background: #e6e8eb; color: #1c1f24; border-color: #e6e8eb; font-weight: 600; }
  .mk-note { color: #9aa3ad; margin-left: auto; }
  .mk-cap { border-top: 1px solid #2c323a; padding: 8px 16px 10px; color: #cfd4da; line-height: 1.6; display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
  .mk-cap b { color: #fff; }
  .mk-cap ul { margin: 0; padding-left: 16px; }

  /* ── 틀: 사이드바 232 + 본문 ── */
  .sx { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: calc(100vh - var(--mk-h, 0px)); }
  .main { min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: 24px 32px 72px; }
  .wrap { max-width: 1480px; margin: 0 auto; }

  /* ── 사이드바 (rn-sidebar.tsx · 디자인 규칙 '사이드바 메뉴') ── */
  .sx-side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 18px 12px 14px; background: var(--white); border-right: 1px solid var(--line); }
  .sx-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 4px; }
  .sx-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  .sx-wm { display: flex; flex-direction: column; line-height: 1.15; }
  .sx-wm b { font-size: 14px; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }
  .sx-wm small { font-size: 11px; color: var(--ink-muted); }
  .snb { display: flex; flex-direction: column; gap: 1px; }
  .snb-more { padding-top: 12px; border-top: 1px solid var(--line); }
  .snb .sec { display: flex; flex-direction: column; gap: 1px; }
  .snb .sec + .sec { margin-top: 14px; }
  .snb .sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .snb .sec > summary::-webkit-details-marker { display: none; }
  .snb .sec > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); opacity: .55; transition: transform .15s var(--ease); }
  .snb .sec[open] > summary::after { transform: rotate(45deg); margin-top: -3px; }
  .snb .sec > summary:hover { background: var(--sand-light); color: var(--ink-2); }
  .snb .sec[data-here] > summary { color: var(--ink); }
  .snb a { position: relative; display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .snb a:hover { background: rgba(0,44,95,.06); color: var(--navy); }
  .snb a.on { background: var(--navy-tint); color: var(--navy); font-weight: 600; }
  .snb a > span.l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snb .ni { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-faint); }
  .snb a:hover .ni, .snb a.on .ni { color: var(--navy); }
  .snb .st { margin-left: auto; display: flex; color: var(--ink-faint); }
  .snb .st .ni { width: 14px; height: 14px; }
  .snb .ngrp { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
  .snb .par { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; font-size: 12px; font-weight: 700; color: var(--ink-muted); cursor: default; }
  .snb .tree { display: flex; flex-direction: column; gap: 1px; margin: 0 0 2px 17px; padding-left: 6px; border-left: 1px solid var(--line); }
  .snb .tree a { min-height: 30px; }
  .snb .tree a.on::before { content: ""; position: absolute; left: -7px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--navy); }
  .snb .grp { padding: 10px 10px 2px; font-size: 11px; font-weight: 700; color: var(--ink-muted); }
  .sx-out { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--navy-25); color: var(--ink-2); font-size: 11px; line-height: 1.5; }
  .sx-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .sx-acct { display: flex; align-items: center; gap: 10px; padding: 8px 8px 2px; border-top: 1px solid var(--line); }
  .sx-av { width: 30px; height: 30px; border-radius: 50%; background: var(--navy-50); color: var(--navy); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .sx-who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
  .sx-acct b { font-size: 12px; } .sx-acct small { font-size: 11px; color: var(--ink-muted); }
  .sx-acct .lang { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ink-muted); }

  /* 프로젝트 카드 (안 A · B): 지금 어느 프로젝트인지 + 바꾸기 */
  .pj { display: grid; grid-template-columns: minmax(0, 1fr) 30px; align-items: center; gap: 0 6px; margin: 4px 0 4px; padding: 8px 6px 8px 12px; border-radius: 10px; background: var(--sand-light); box-shadow: inset 0 0 0 1px var(--line); }
  .pj b { display: block; font-size: 13px; font-weight: 700; color: var(--ink); }
  .pj small { display: block; font-size: 11px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-muted); }
  .icon:hover, .icon[aria-expanded="true"] { background: var(--sand-inset); color: var(--ink); }
  .icon:focus-visible { outline: 2px solid var(--navy); }
  /* 안 C: 메뉴 안의 프로젝트 줄 */
  .snb a.prow .mono { font-size: 12.5px; }
  .snb a.prow .chev { margin-left: auto; transition: transform .15s; color: var(--ink-faint); }
  .snb a.prow.open .chev { transform: rotate(90deg); }
  .snb .tree .tree { margin-left: 10px; }

  /* 바꾸기 창 */
  .pop { position: fixed; z-index: 90; width: 420px; max-height: min(560px, calc(100vh - 120px)); display: flex; flex-direction: column; background: var(--white); border-radius: 14px; box-shadow: var(--shadow-3), 0 0 0 1px var(--line); }
  .pop[hidden] { display: none; }
  .pop-h { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px 16px; }
  .pop-h b { font-size: 14px; }
  .pop-h .icon { margin-left: auto; }
  .pop-s { padding: 0 12px 8px; }
  .pop-l { overflow-y: auto; padding: 0 6px 6px; border-top: 1px solid var(--line); }
  .pop-l button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 8px 10px; border-radius: 8px; }
  .pop-l button:hover, .pop-l button:focus-visible { background: var(--navy-25); }
  .pop-l button[aria-current] { background: var(--navy-tint); }
  .pop-l .t { font-size: 13px; font-weight: 600; }
  .pop-l .m { font-size: 12px; color: var(--ink-muted); text-align: right; white-space: nowrap; }
  .pop-l .p { grid-column: 1 / -1; font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop-f { padding: 8px 16px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted); display: flex; gap: 10px; align-items: center; }
  .pop-f .lnk { margin-left: auto; }

  /* ── 페이지 ── */
  .pg { display: flex; flex-direction: column; gap: 16px; }
  .ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
  .ph h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.25; }
  .ph .sub { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--ink-muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--white); font-size: 12px; color: var(--ink-2); }
  .pill b { font-weight: 700; }
  .card { background: var(--white); border-radius: var(--r-card); box-shadow: var(--shadow-card); position: relative; }
  .card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 18px 22px 12px 24px; }
  .card-h h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .card-h .hint { font-size: 12px; color: var(--ink-muted); }
  .card.q { background: var(--sand-light); box-shadow: inset 0 0 0 1px var(--line); }
  .card.q p { margin: 0; padding: 0 24px 18px; font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .card.mko { background: #fffdf5; box-shadow: inset 0 0 0 1.5px #ecd98a; }
  .card.mko .card-h h2::before { content: "목업 안내"; margin-right: 8px; padding: 1px 6px; border-radius: 4px; background: #f4c542; color: #1c1f24; font-size: 11px; font-weight: 700; vertical-align: 2px; }
  .btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--line-2); background: var(--white); color: var(--ink-2); }
  .btn:hover { border-color: var(--ink-faint); }
  .lnk { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--navy); }
  .lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
  .tb { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 16px 22px 12px 24px; }
  .tb .r { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); }
  .finwrap { position: relative; width: 360px; }
  .finwrap .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); }
  .finput { width: 100%; height: 34px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px 0 32px; font-size: 13px; color: var(--ink); background: var(--white); outline: none; }
  .finput:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,44,95,.12); }
  .seg { display: inline-flex; padding: 3px; background: var(--sand-inset); border-radius: 9px; }
  .seg button { all: unset; cursor: pointer; height: 28px; line-height: 28px; padding: 0 12px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--ink-muted); }
  .seg button.on { background: var(--white); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-1); }
  .seg button .c { margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tblwrap { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  th { height: 38px; text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-muted); padding: 0 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--white); }
  th:first-child, td:first-child { padding-left: 24px; }
  th:last-child, td:last-child { padding-right: 24px; }
  th.r, td.r { text-align: right; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  td.r { font-variant-numeric: tabular-nums; }
  tr.go { cursor: pointer; }
  tr.go:hover td, tr.go:focus-visible td { background: var(--navy-25); }
  tr.go:focus-visible { outline: none; }
  td .id { font-weight: 700; }
  td .pt { display: block; margin-top: 1px; font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.none { color: var(--ink-faint); }
  .tmore { display: flex; align-items: center; gap: 12px; padding: 12px 24px 16px; font-size: 12px; color: var(--ink-muted); }
  .empty { padding: 28px 24px; color: var(--ink-muted); font-size: 13px; }
  /* 메뉴 → 화면 표 */
  .map td { font-size: 12.5px; line-height: 1.5; }
  .map tr.here td { background: var(--navy-25); box-shadow: inset 0 1px 0 var(--navy-300), inset 0 -1px 0 var(--navy-300); }
  .map tr.here td:first-child { font-weight: 700; color: var(--navy); }
  .map tr.off td { color: var(--ink-muted); }
  .map code, .cmp code, .card.q code { font-family: var(--mono); font-size: 11.5px; background: var(--sand-light); padding: 0 4px; border-radius: 4px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: var(--navy-tint); color: var(--navy); }
  .tag.wip { background: var(--sand-inset); color: var(--ink-muted); }
  .tag.key { background: #fbf3dc; color: #7a5d12; }
  .tag .ni { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 본문 자리 (프로젝트 안) */
  .frame { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 20px; }
  .ph-box { border-radius: var(--r-card); border: 1.5px dashed var(--line-2); background: rgba(255,255,255,.55); padding: 16px 18px; color: var(--ink-muted); font-size: 12px; line-height: 1.7; min-height: 220px; }
  .ph-box b { display: block; margin-bottom: 4px; color: var(--ink-2); font-size: 13px; }
  .ph-box.veil { background: repeating-linear-gradient(135deg, rgba(246,243,242,.9) 0 10px, rgba(255,255,255,.9) 10px 20px); }
  /* 안 비교 */
  .cmp td { font-size: 12.5px; line-height: 1.55; vertical-align: top; }
  .cmp tr.rec td { background: var(--navy-25); }
  .cmp tr.rec td:first-child b { color: var(--navy); }
  .cmp tr.out td { color: var(--ink-muted); }
  .cmp-n { margin: 0; padding: 12px 24px 18px; font-size: 12px; color: var(--ink-muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="mk" id="mk">
  <div class="mk-row">
    <span class="mk-tag">목업</span><span class="mk-title">Project 메뉴 구성 · 설계 중</span>
    <span class="mk-group" role="group" aria-label="안"><span>안</span>
      <button class="mk-btn" data-opt="A">A 프로젝트 문맥 구역 · 추천</button><button class="mk-btn" data-opt="B">B 프로젝트 전용 사이드바</button><button class="mk-btn" data-opt="C">C 메뉴에 프로젝트 나열</button></span>
    <span class="mk-group" role="group" aria-label="화면"><span>화면</span>
      <button class="mk-btn" data-view="list">목록</button><button class="mk-btn" data-view="project">프로젝트 안</button></span>
    <span class="mk-group" role="group" aria-label="계정"><span>계정</span>
      <button class="mk-btn" data-acct="admin">관리자</button><button class="mk-btn" data-acct="scoped">범위 계정</button></span>
    <span class="mk-note">읽기 단계(P0~P5)를 마친 뒤 모습 · 공사 = 리뉴얼 화면 없음 · 열쇠 = GA4 계정 대기</span>
  </div>
  <div class="mk-cap" id="mk-cap"></div>
</div>
<div class="sx">
  <aside class="sx-side" id="side" aria-label="사이드 메뉴"></aside>
  <main class="main" id="main"><div class="wrap" id="page"></div></main>
</div>
<div class="pop" id="pop" role="dialog" aria-label="프로젝트 바꾸기" hidden>
  <div class="pop-h"><b>프로젝트 바꾸기</b><span class="muted" id="pop-n"></span><button class="icon" id="pop-x" aria-label="닫기"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="pop-s"><label class="finwrap" style="width:100%"><svg class="i s14"><use href="#i-search"/></svg><input class="finput" id="pop-q" placeholder="ID · 프롬프트 원문 · 국가" aria-label="프로젝트 찾기"></label></div>
  <div class="pop-l" id="pop-l"></div>
  <div class="pop-f"><span id="pop-f"></span><button class="lnk" id="pop-all">전체 목록 →</button></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="n-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
  <symbol id="n-list-checks" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>

    return void (side.innerHTML = brand + nav + `<div class="sx-foot">${tip}<nav class="snb">${link("Project list", { ico: "i-back", act: "list" })}</nav>${acct}</div>`);
  }
  const top = `<nav class="snb" aria-label="메뉴">${section("standard", "Global", menuTree(GLOBAL, "Global"))}${section("website", "Website", menuTree(WEBSITE, "Website"))}</nav>`;
  let more = "";
  if (S.acct === "admin") {
    let proj = link("Project list", { ico: "n-briefcase", on: S.view === "list", act: "list" });
    if (S.opt === "A" && S.view === "project") proj += projectCard() + projectTree();
    if (S.opt === "C") {
      proj += `<span class="grp">최근 연 프로젝트</span>` + S.recent.map((id) => {
        const opened = S.view === "project" && id === S.pid;
        return `<a class="prow${opened ? " open" : ""}" data-act="enter:${id}">${icon("n-briefcase")}<span class="l mono">${id}</span><svg class="ni chev" aria-hidden="true"><use href="#i-chev-r"/></svg></a>` + (opened ? `<div class="tree">${projectTree(true)}</div>` : "");
      }).join("");
    }
    more = `<nav class="snb snb-more" aria-label="프로젝트 · 관리">${section("project", "Project", proj, true)}${section("admin", "Admin", menuTree(ADMIN, "Admin"))}</nav>`;
  }
  side.innerHTML = brand + top + more + `<div class="sx-foot">${tip}${acct}</div>`;
}

// ── 본문 ──
function cmpCard() {
  const row = (cls, name, a, b, c, d, v) => `<tr class="${cls}"><td><b>${name}</b></td><td>${a}</td><td>${b}</td><td>${c}</td><td>${d}</td><td>${v}</td></tr>`;
  return `<section class="card mko cmp"><div class="card-h"><h2>안 비교 (UX 기준)</h2><span class="hint">위 목업 바에서 안을 바꿔 사이드바를 봅니다</span></div>
  <div class="tblwrap"><table><colgroup><col style="width:150px"><col><col style="width:200px"><col style="width:200px"><col style="width:210px"><col style="width:170px"></colgroup>
  <thead><tr><th>안</th><th>프로젝트 안에서 Global · Website · Admin 가기</th><th>지금 어느 프로젝트인지</th><th>다른 프로젝트로</th><th>메뉴 깊이</th><th>판단</th></tr></thead><tbody>
  ${row("rec", "A 프로젝트 문맥 구역", "구역 제목을 펼쳐 바로 — 사이드바는 그대로", "사이드바 카드 (ID, 정본이 생기면 이름)", "카드 ⇅ → 같은 메뉴로", "2단 · 레거시와 같음", "<b>추천</b>")}
  ${row("", "B 프로젝트 전용 사이드바", "Project list로 나간 뒤 — 위 GNB가 없어 레거시보다 한 단계 멂", "사이드바 카드", "카드 ⇅ → 같은 메뉴로", "2단", "집중은 좋지만 다른 구역이 멀다")}
  ${row("", "C 메뉴에 프로젝트 나열", "바로", "펼친 프로젝트 줄 (ID)", "메뉴의 다른 줄 — 최근 3개만", "3단 — 디자인 규칙 트리 밖", "ID 줄이 읽히지 않는다")}
  ${row("out", "D 상세는 페이지 안 탭 (그리지 않음)", "사이드바는 Project list만", "페이지 머리", "목록으로 나가서", "탭 안에 탭 (Mention · Citation 보기 탭)", "제외 — 디자인 규칙 ‘화면 안 전환 탭으로 다른 메뉴 가기’ 금지")}
  </tbody></table></div>
  <p class="cmp-n">A의 접힘이 필요한 이유(이 목업을 1920×915로 잰 값): Global · Website를 다 펼친 채로 프로젝트 메뉴를 붙이면 Project 구역이 약 660px에서 시작하고 Analysis가 약 940px로 화면 밖에 놓입니다. 두 구역을 접으면 프로젝트 메뉴 끝(Member)이 약 710px입니다. 프로젝트 밖으로 나오면 구역은 보는 사람이 둔 대로 돌아갑니다.</p></section>`;
}

function listRows() {
  let rows = P.filter((p) => (S.seg === "all" ? true : S.seg === "yes" ? p.answers > 0 : p.answers === 0));
  const q = S.q.trim().toLowerCase();
  if (q) rows = rows.filter((p) => (p.id + " " + p.first + " " + countries(p) + " " + p.geos.join(" ")).toLowerCase().includes(q));
  const key = { last: (p) => p.last || "", answers: (p) => p.answers, prompts: (p) => p.prompts }[S.sort];
  if (S.sort !== "last") rows = [...rows].sort((a, b) => key(b) - key(a));
  return rows;
}
function renderList() {
  if (S.acct !== "admin") return renderScoped();
  const all = P.length, yes = P.filter((p) => p.answers > 0).length;
  const rows = listRows(), shown = rows.slice(0, S.shown);
  const td = (v, cls = "r") => (v === "" || v == null ? `<td class="${cls} none">—</td>` : `<td class="${cls}">${v}</td>`);
  const body = shown.map((p) => `<tr class="go" tabindex="0" data-act="enter:${p.id}">
    <td><span class="id mono">${p.id}</span><span class="pt" title="${esc(p.first)}">${p.first ? esc(p.first) : "프롬프트 없음"}</span></td>
    ${td(esc(countries(p)), "")}${td(p.langs.join(" · "), "")}${td(p.engines.map((e) => ENGINE[e] || e).join(" · "), "")}
    ${td(p.prompts.toLocaleString())}${td(p.answers ? p.answers.toLocaleString() : "")}${td(p.rounds || "")}${td(p.last)}${td(p.fields || "")}</tr>`).join("");
  page.innerHTML = `<div class="pg">
  <header class="ph"><div><h1>Project list</h1><div class="sub"><span class="desc">프로젝트마다 측정한 프롬프트와 답변입니다. 행을 누르면 그 프로젝트의 Dashboard가 열립니다.</span><span class="pill">${icon("i-cal", "i s14")}마지막 측정 <b>${LAST_MEASURED}</b></span></div></div></header>
  <section class="card">
    <div class="tb">
      <label class="finwrap">${icon("i-search", "i s14")}<input class="finput" id="q" value="${esc(S.q)}" placeholder="ID · 프롬프트 원문 · 국가" aria-label="프로젝트 찾기"></label>
      <span class="seg" role="group" aria-label="답변">${[["all", "전체", all], ["yes", "답변 있음", yes], ["no", "답변 없음", all - yes]].map(([k, l, c]) => `<button class="${S.seg === k ? "on" : ""}" data-seg="${k}">${l}<span class="c">${c}</span></button>`).join("")}</span>
      <span class="r">정렬 <span class="seg">${[["last", "마지막 측정"], ["answers", "답변"], ["prompts", "프롬프트"]].map(([k, l]) => `<button class="${S.sort === k ? "on" : ""}" data-sort="${k}">${l}</button>`).join("")}</span></span>
    </div>
    <div class="tblwrap"><table><colgroup><col><col style="width:150px"><col style="width:80px"><col style="width:150px"><col style="width:84px"><col style="width:84px"><col style="width:64px"><col style="width:100px"><col style="width:96px"></colgroup>
      <thead><tr><th>프로젝트</th><th>측정 국가</th><th>언어</th><th>엔진</th><th class="r">프롬프트</th><th class="r">답변</th><th class="r">회차</th><th class="r">마지막 측정</th><th class="r">커스텀 태그</th></tr></thead>
      <tbody>${body}</tbody></table>${rows.length ? "" : `<div class="empty">맞는 프로젝트가 없습니다.</div>`}</div>
    ${rows.length > S.shown ? `<div class="tmore"><button class="btn" data-act="more">20개 더 보기</button><span>${shown.length} / ${rows.length}</span></div>` : `<div class="tmore"><span>${rows.length}개</span></div>`}
  </section>
  <section class="card q"><div class="card-h"><h2>이름 · 브랜드 · 국가가 없는 이유</h2></div>
    <p>Gold에는 프로젝트 ID만 있고 이름 · 브랜드 · 국가 · 담당은 원본 운영 DB(<code>app.project</code>)에만 있습니다. 정본이 정해지면(결정 2) 첫 열이 이름이 되고 ID는 그 아래 줄로 내려갑니다. 그 전에는 첫 프롬프트 원문(Gold 값)으로 구별합니다. 측정 국가 · 언어 · 엔진은 측정된 답변의 값이고, 답변이 없는 프로젝트는 ‘—’입니다. ‘새 프로젝트’ 버튼은 입력 단계(결정 3)에서 붙습니다.</p></section>
  ${cmpCard()}</div>`;
  const qi = document.getElementById("q");
  qi.addEventListener("input", () => { S.q = qi.value; S.shown = 20; const pos = qi.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
}
function renderScoped() {
  page.innerHTML = `<div class="pg"><header class="ph"><div><h1>범위 계정에는 Project가 없습니다</h1><div class="sub"><span class="desc">hq · region · country 계정의 사이드바입니다. 본문은 그 계정이 여는 다른 화면입니다.</span></div></div></header>
  <section class="card mko q"><div class="card-h"><h2>Project 구역을 숨기는 이유</h2></div>
    <p>⛔J(2026-10-31)로 project는 관리자만 읽습니다. 프로젝트에는 브랜드 · 국가가 없어 계정 범위를 걸 수 없습니다. 지금 앱은 범위 계정에도 ‘Project list’가 보이고, 열면 미구현 안내 · BFF 403입니다. 정본(결정 2)에 브랜드 · 국가가 생기고 프로젝트 역할(vendor 등)을 정하면 다시 엽니다.</p></section>
  ${cmpCard()}</div>`;
}
function renderProject() {
  if (S.acct !== "admin") return renderScoped();
  const s = SUBS[S.sub], p = byId[S.pid], [cls, ico, label] = ST_TAG[s.st];
  const tag = `<span class="tag ${cls}">${ico ? icon(ico) : ""}${label}</span>`;
  const body = s.st === "wip"
    ? `<div class="ph-box"><b>미구현 안내 화면</b>리뉴얼 화면이 없는 메뉴는 앱의 미구현 안내(renewal/[...slug])를 엽니다. ${s.screen} — ${s.step}에서 범위 확인부터 합니다.</div>`
    : `<div class="frame"><div class="ph-box"><b>필터 패널 296px</b>측정 국가 · 언어 · 엔진 · 기간 · 커스텀 태그(cf_*). 축과 옵션은 레거시 프로젝트 필터와 같고, 저장한 필터 키는 project-&lt;화면&gt;.</div>
       <div class="ph-box${s.st === "key" ? " veil" : ""}"><b>본문 — ${s.step}에서 설계</b>${s.screen}.<br>읽는 데이터: ${s.data}.${s.st === "key" ? "<br>GA4 계정이 없으면 샘플 화면 위에 막을 덮습니다(디자인 규칙 ‘계정 대기’)." : ""}</div></div>`;
  const mapRows = Object.entries(SUBS).map(([id, x]) => { const [c, i, l] = ST_TAG[x.st]; return `<tr class="${id === S.sub ? "here" : ""}"><td>${x.path}</td><td>${x.screen}</td><td>${x.data}</td><td>${x.step}</td><td><span class="tag ${c}">${i ? icon(i) : ""}${l}</span></td></tr>`; }).join("");
  page.innerHTML = `<div class="pg">
  <header class="ph"><div><h1>${SUBS[S.sub].path.split(" › ").pop()}</h1><div class="sub"><span class="desc">${s.desc}</span>${s.st === "ok" || s.st === "key" ? `<span class="pill">${icon("i-cal", "i s14")}마지막 측정 <b>${p.last ? "2026-" + p.last : "—"}</b></span>` : ""}</div></div></header>
  ${body}
  <section class="card mko map"><div class="card-h"><h2>메뉴 → 화면</h2><span class="hint">레거시 순서 · 라벨 그대로. 지금 프로젝트 <span class="mono">${p.id}</span>는 페이지 머리에 다시 쓰지 않고 사이드바 카드에만 둡니다.</span></div>
    <div class="tblwrap"><table><colgroup><col style="width:230px"><col><col style="width:330px"><col style="width:96px"><col style="width:130px"></colgroup>
    <thead><tr><th>메뉴</th><th>열리는 화면</th><th>읽는 데이터</th><th>단계</th><th>읽기 단계 뒤</th></tr></thead>
    <tbody>${mapRows}<tr class="off"><td>AI Visibility · ACR</td><td>메뉴에 두지 않음</td><td>레거시도 숨김 · ACR은 Gold에 2곳뿐</td><td>—</td><td>—</td></tr></tbody></table></div></section>
  ${cmpCard()}</div>`;
}

// ── 목업 바 · 바꾸기 창 ──
function renderCap() {
  const c = CAPS[S.opt];
  cap.innerHTML = `<div>${c.what}</div><div><b>좋은 점</b><ul>${c.pro.map((x) => `<li>${x}</li>`).join("")}</ul><b>아쉬운 점</b><ul>${c.con.map((x) => `<li>${x}</li>`).join("")}</ul></div>`;
  document.querySelectorAll("[data-opt]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.opt === S.opt));
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  document.querySelectorAll("[data-acct]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.acct === S.acct));
  document.documentElement.style.setProperty("--mk-h", document.getElementById("mk").offsetHeight + "px");
}
function render() { closePop(); renderCap(); renderSide(); (S.view === "list" ? renderList : renderProject)(); }
function enter(id) {
  S.pid = id; S.view = "project";
  S.recent = [id, ...S.recent.filter((x) => x !== id)].slice(0, 3);
  main.scrollTop = 0; render();
}

function popRows() {
  const q = popQ.value.trim().toLowerCase();
  const rows = P.filter((p) => !q || (p.id + " " + p.first + " " + countries(p) + " " + p.geos.join(" ")).toLowerCase().includes(q));
  popN.textContent = `${rows.length}개`;
  popL.innerHTML = rows.slice(0, 60).map((p) => `<button data-pid="${p.id}" ${p.id === S.pid ? 'aria-current="true"' : ""}><span class="t mono">${p.id}</span><span class="m">${esc(countries(p) || "측정 없음")}${p.answers ? ` · 답변 ${p.answers.toLocaleString()}` : ""}</span><span class="p">${p.first ? esc(p.first) : "프롬프트 없음"}</span></button>`).join("") || `<div class="empty">맞는 프로젝트가 없습니다.</div>`;
}
function openPop(btn) {
  const r = btn.closest(".pj").getBoundingClientRect();
  pop.style.left = r.right + 14 + "px";
  pop.style.top = Math.max(r.top - 8, 48) + "px";
  pop.hidden = false; btn.setAttribute("aria-expanded", "true");
  popQ.value = ""; popRows();
  popF.textContent = `같은 메뉴(${SUBS[S.sub].path})로 엽니다`;
  popQ.focus();
}
function closePop() { if (!pop.hidden) { pop.hidden = true; const b = document.getElementById("pj-sw"); if (b) { b.setAttribute("aria-expanded", "false"); b.focus(); } } }

const side = document.getElementById("side"), page = document.getElementById("page"), main = document.getElementById("main"), cap = document.getElementById("mk-cap");
const pop = document.getElementById("pop"), popQ = document.getElementById("pop-q"), popL = document.getElementById("pop-l"), popN = document.getElementById("pop-n"), popF = document.getElementById("pop-f");

document.getElementById("mk").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.opt) S.opt = b.dataset.opt;
  if (b.dataset.view) S.view = b.dataset.view;
  if (b.dataset.acct) S.acct = b.dataset.acct;
  render();
});
let tipT;
side.addEventListener("click", (e) => {
  const sm = e.target.closest("details.sec > summary");
  if (sm) { e.preventDefault(); const d = sm.parentElement; d.open = !d.open; openMap()[d.dataset.sec] = d.open; return; }
  if (e.target.closest("#pj-sw")) { pop.hidden ? openPop(e.target.closest("#pj-sw")) : closePop(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  e.preventDefault();
  const [k, v] = a.dataset.act.split(/:(.*)/s);
  if (k === "list") { S.view = "list"; render(); }
  else if (k === "sub") { S.sub = v; S.view = "project"; render(); }
  else if (k === "enter") { if (S.view === "project" && S.pid === v && S.opt === "C") { S.view = "list"; render(); } else enter(v); }
  else if (k === "out") {
    const tip = document.getElementById("sx-out");
    tip.textContent = `메뉴 견본 — 앱에서는 ‘${v}’ 리뉴얼 화면이 열립니다.`; tip.hidden = false;
    clearTimeout(tipT); tipT = setTimeout(() => (tip.hidden = true), 3000);
  }
});
page.addEventListener("click", (e) => {
  const b = e.target.closest("[data-seg],[data-sort],[data-act]"); if (!b) return;
  if (b.dataset.seg) { S.seg = b.dataset.seg; S.shown = 20; renderList(); }
  else if (b.dataset.sort) { S.sort = b.dataset.sort; S.shown = 20; renderList(); }
  else if (b.dataset.act === "more") { S.shown += 20; renderList(); }
  else if (b.dataset.act.startsWith("enter:")) enter(b.dataset.act.slice(6));
});
page.addEventListener("keydown", (e) => { const tr = e.target.closest("tr.go"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); enter(tr.dataset.act.slice(6)); } });
popQ.addEventListener("input", popRows);
popL.addEventListener("click", (e) => { const b = e.target.closest("[data-pid]"); if (b) enter(b.dataset.pid); });
document.getElementById("pop-x").addEventListener("click", closePop);
document.getElementById("pop-all").addEventListener("click", () => { S.view = "list"; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });
document.addEventListener("mousedown", (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest("#pj-sw")) closePop(); });
window.addEventListener("resize", () => document.documentElement.style.setProperty("--mk-h", document.getElementById("mk").offsetHeight + "px"));
render();
</script>
