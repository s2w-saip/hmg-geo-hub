name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ⚠️ GitHub 호스티드 러너다 — 측정 lane 의 셀프호스트 iMac(`imac-docker`)이 **아니다**.
    #    이 lane 의 CI 는 Docker 를 요구하지 않는다: 큐·리스 테스트가 PGlite(WASM Postgres)로
    #    돌기 때문이다. 측정 lane 이 셀프호스트를 쓰는 이유는 compose PG 와 arm64 네이티브
    #    이미지 빌드였고, 그 둘이 없으면 호스티드가 싸고 빠르고 남의 colima 에 안 묶인다
    #    (2026-08-29 실측: 맥북 colima 가 꺼지면 CI 가 전멸했다).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ⚠️ `version:` 을 주지 않는다 — package.json 의 `packageManager` 가 정본이고, 둘 다 주면
      #    액션이 `Multiple versions of pnpm specified` 로 죽는다(2026-09-12 첫 CI 실행 실측).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 컨테이너 이미지(node:20-bookworm-slim)와 **같은 메이저**로 맞춘다. CI 가 더 새로운
          # 노드로만 돌면 런타임에서만 나타나는 결함이 CI 를 지나간다.
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 벤더된 순수 분석 코드가 **핀된 코어 바이트 그대로**인지. 손으로 고쳤거나 몰래 얹은
      # 파일이 있으면 여기서 죽는다 — 버전 스큐 차단의 lane 쪽 절반(스펙 §6.1 게이트 1 · A24).
      # typecheck 보다 **먼저** 둔다: 벤더가 오염된 상태에서 통과한 타입체크는 아무것도 증명하지 않는다.
      - name: analysis-core pin
        run: pnpm check:analysis-core-pin

      - name: typecheck
        run: pnpm typecheck

      # 계약 fixture 동치 — 필드를 지우거나 이름을 바꾸면 여기서 먼저 깨진다.
      - name: contracts
        run: pnpm test:contracts

      # 경계(A8): 코어 DB 문자열·드라이버 의존성 0건, 마이그레이션은 analysis_* 만,
      # 시크릿 모양 리터럴 0건. **경계는 리뷰가 아니라 테스트가 지킨다.**
      - name: boundary
        run: pnpm test:boundary

      # 골든 게이트 — 코어 픽스처 13개를 lane 경로로 통과시켜 **바이트 동일**을 판정한다
      # (스펙 §6 A1). LLM 실비 0: 스텁은 순수 코드의 `deps.llm` seam 에 붙고,
      # 공급자 풀 테스트는 **녹화 fetch** 로 돈다.
      - name: golden (analysis-core equivalence)
        run: pnpm test:golden

      # 큐·리스·리퍼 SQL 을 진짜 Postgres(PGlite)에서 실행 + 골격 e2e + 공급자 풀(LLM 실비 0).
      - name: unit + e2e
        run: pnpm test

      # 인프라가 코드와 함께 깨지지 않게 한다. VPC 를 fromVpcAttributes 로 받으므로
      # **AWS 자격증명 없이** 돈다(infra/lib/analysis-stack.ts 상단 ⚠️).
      - name: cdk synth
        run: pnpm cdk:synth

  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 빌드만 한다 — **푸시하지 않는다.** ECR 푸시·배포는 수동 게이트다(스펙 §9: lane 스택은
      # 전부 수동). 여기서 잡으려는 것은 "Dockerfile 이 깨졌다"뿐이다.
      #
      # ⚠️ **호스트 아키텍처(amd64)로 굽는다** — 배포 이미지는 arm64 이고 그쪽은
      #    push-images-stage.yml 이 QEMU 로 만든다. 여기서 arm64 를 굽지 않는 것은 의도다:
      #    이 잡의 목적이 "Dockerfile 문법·패키지 존재" 뿐이고 에뮬레이션은 PR 마다 수 분을 먹는다.
      - run: docker build -f deploy/Dockerfile.api -t scope-analysis-api:ci .
      - run: docker build -f deploy/Dockerfile.worker -t scope-analysis-worker:ci .
      # 인그레스는 `apk add aws-cli jq` 를 한다 — alpine 리포에서 그 패키지가 사라지면
      # **여기서** 깨지고, 라이브 배포에서 깨지지 않는다.
      - run: docker build -f deploy/Dockerfile.ingress -t scope-analysis-ingress:ci .
      # 인그레스 entrypoint 는 셸 스크립트다. 문법 오류는 컨테이너 기동에서만 드러나므로
      # (그때는 NLB 타깃 unhealthy 로 보인다) CI 에서 파싱만 먼저 본다.
      - run: sh -n deploy/ingress/entrypoint.sh

      # ⚠️ **`nginx -t` 를 여기서 돌린다.** `sh -n` 은 entrypoint 의 문법만 본다 — nginx.conf 의
      #    오타·잘못된 컨텍스트·없는 모듈(`stub_status`)은 **기동에서만** 드러나고, 그 실패는
      #    "NLB 타깃 unhealthy" 로 위장한다(tests/ingress.test.ts 헤더의 그 실패 모드). 정합
      #    테스트는 세 파일이 같은 *문자열*을 쓰는지만 보고, nginx 가 그 conf 를 받아들이는지는
      #    모른다 — 그 판정은 nginx 바이너리만 할 수 있고, 그 바이너리가 있는 첫 지점이 여기다.
      #
      #    인증서는 **더미**다. 라이브 인증서는 기동 시 Secrets Manager 에서 오고 CI 는 그것을
      #    보지 않는다(룰 secrets-handling). `nginx -t` 는 PEM 을 파싱할 수만 있으면 되므로
      #    자체 서명 1일짜리로 충분하다 — CA 자리에는 같은 인증서를 넣는다.
      #    `--entrypoint nginx` 로 **entrypoint 를 우회**한다: 기본 entrypoint 는 시크릿을
      #    읽으려 하고 CI 에는 자격증명이 없다(그리고 그것을 주는 것이 목적도 아니다).
      - name: nginx -t (더미 인증서로 conf 문법·모듈 검증)
        run: |
          set -euo pipefail
          CERTS="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-dummy" \
            -keyout "$CERTS/server.key" -out "$CERTS/server.crt" 2>/dev/null
          cp "$CERTS/server.crt" "$CERTS/ca.crt"
          chmod 0644 "$CERTS"/*.crt "$CERTS/server.key"
          docker run --rm --entrypoint nginx \
            -v "$CERTS:/etc/nginx/certs:ro" scope-analysis-ingress:ci -t
          rm -rf "$CERTS"
