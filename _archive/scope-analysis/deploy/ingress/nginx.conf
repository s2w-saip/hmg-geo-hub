# mTLS 인그레스 — **클라이언트 인증서 검증은 여기서 종단하고 앱은 인증을 모른다.**
# 측정 lane `deploy/ingress/nginx.conf` 와 같은 구조이고, 코어는 이미 클라이언트 인증서를 갖고
# 있다(승인 L4: 측정 lane 과 같은 CA — 운영 절차를 1벌로 유지).
#
# ⚠️ **"같은 구조"가 "같은 파일"은 아니다.** 두 곳이 갈린다 — 둘 다 실행 기반 차이(EC2 vs Fargate)에서
#    나온다: ① 인증서 경로(`/certs` bind mount → `/etc/nginx/certs` + 기동 시 시크릿 주입)
#    ② 업스트림 호스트(`api:8080` → `127.0.0.1:8080`, 아래 upstream 블록 주석).
#    측정 lane conf 를 복붙해 오면 둘 다 되살아나고, 둘 다 **기동에서만** 드러난다.
#
# ── 커넥션 용량 산술
#
#   커넥션을 여는 쪽은 **코어뿐**이다(아웃박스 submitter + reply 폴링/되읽기).
#     코어 submitter·되읽기      ≈ 코어 워커 태스크 × keepAlive 커넥션. 측정 lane 은 3,000 이었다.
#     lane worker fleet(0~16)    =     0   (원장 DSN 직결, 인그레스 미경유)
#     운영 curl·프로브            ≈    50
#   ⚠️ **분석 티켓 수는 측정 티켓 수보다 많다** — 티켓 입도가 턴이라 query_run 당 턴 수만큼 곱해진다.
#      그 분포는 **미측정**(스펙 §14-8 U2)이고, 단계 3 전에 세는 것이 api 사이징의 입력이다.
#      지금 값은 측정 lane 과 같은 여유(worker_connections 8192 × auto)로 두고 실측 후 조정한다.
#
# ⚠️ `client_max_body_size 2m` 는 **계약 상한(turn 1 MiB)과 다른 층**이다. 여기는 네트워크
#    경계에서 거대한 요청을 앱에 닿기 전에 끊고, 계약 상한은 앱이 400 으로 끝낸다
#    (contracts/limits.ts). 한쪽만 바꾸면 두 층이 어긋난다.
worker_processes auto;
worker_rlimit_nofile 32768;
events { worker_connections 8192; }
http {
  # 업스트림 keep-alive — 재사용으로 worker_connection 소모를 절반화.
  # ⚠️ keepalive_timeout 4s 는 node 서버의 기본 keep-alive(5s) 보다 **짧아야** 한다.
  #    nginx(업스트림의 클라이언트)가 먼저 끊어야 죽은 커넥션 재사용 레이스가 안 생긴다.
  upstream api_upstream {
    # ⚠️ **`api:8080` 이 아니라 `127.0.0.1:8080` 이다.** 태스크가 `awsvpc` 네트워크 모드라
    #    같은 태스크의 컨테이너들은 **네트워크 namespace 를 공유**하고 localhost 로 통신한다.
    #    `links` 는 awsvpc 에서 지원되지 않으므로 컨테이너 이름은 DNS 로 풀리지 않는다 —
    #    서비스명을 쓰면 `nginx -t` 가 `host not found in upstream "api"` 로 **기동을 세운다**.
    #    (측정 lane conf 는 `api:8080` 인데, 그쪽은 EC2 + compose bridge 네트워크라 서비스명
    #    DNS 가 된다. 이 lane 이 Fargate 라서 갈리는 지점이고, 로컬 compose 도 아래 방식으로
    #    같은 namespace 를 쓰게 맞췄다 — deploy/compose.yml `network_mode: service:api`.)
    server 127.0.0.1:8080;
    keepalive 128;
    keepalive_timeout 4s;
    keepalive_requests 10000;
  }
  server {
    listen 8443 ssl;
    # ⚠️ 경로는 **entrypoint 와 짝**이다(deploy/ingress/entrypoint.sh CERT_DIR · Dockerfile.ingress
    #    의 mkdir). 한쪽만 바꾸면 nginx 가 기동에서 죽는다 — tests/ingress.test.ts 가 그 정합을 본다.
    #    측정 lane 은 `/certs`(호스트 bind mount) 였다. Fargate 엔 그 호스트가 없어 이미지 안
    #    `/etc/nginx/certs` 로 옮겼고, 파일은 태스크 롤이 기동 시 써 넣는다.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;               # 인증서 없거나 CA 불일치 → 400 (앱까지 오지 않는다)
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    # 분석 티켓은 LLM 을 여러 번 타므로 접수 자체는 짧지만, reply 되읽기는 본문이 클 수 있다.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;           # keepalive 필수 — 1.0 이면 매 요청 새 업스트림 커넥션
      proxy_set_header Connection "";   # 클라 Connection 헤더가 업스트림 풀을 끊지 않게
      proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
      proxy_set_header X-Client-Verify $ssl_client_verify;
      proxy_set_header Host $host;
    }
  }
  # 포화 게이지 — 컨테이너 루프백 전용(포트 미발행).
  server {
    listen 127.0.0.1:8081;
    location = /nginx_status { stub_status; access_log off; }
    location / { return 404; }
  }
}
