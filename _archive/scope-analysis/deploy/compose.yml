# 로컬 실행 전용. ⚠️ **이 커밋에서는 기동하지 않았다** — 파일만 있다(G3-1 작업 경계).
#
#   docker compose -f deploy/compose.yml up --build
#   curl -s localhost:8080/healthz
#   mTLS 인그레스까지: deploy/certs/make-dev-certs.sh 후 `--profile mtls`
name: scope-analysis
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analysis
      POSTGRES_PASSWORD: analysis
      POSTGRES_DB: analysis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analysis -d analysis"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 측정 lane 로컬 PG(55432)와 포트가 겹치지 않게 둔다 — 두 lane 을 동시에 띄우는 것이 정상이다.
    ports: ["127.0.0.1:55433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    env_file: [../.env.example]
    environment:
      ANALYSIS_STORE_DSN: postgresql://analysis:analysis@db:5432/analysis
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
    # ⚠️ 8443 도 **여기서** 발행한다 — 인그레스가 `network_mode: service:api` 로 이 컨테이너의
    #    네트워크 namespace 를 쓰기 때문이다(Fargate awsvpc 와 같은 모양). namespace 를 공유하는
    #    컨테이너는 자기 `ports:` 를 가질 수 없다.
    ports: ["8080:8080", "127.0.0.1:8443:8443"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    env_file: [../.env.example]
    environment:
      ANALYSIS_STORE_DSN: postgresql://analysis:analysis@db:5432/analysis
      ANALYSIS_ENGINE: "${ANALYSIS_ENGINE:-stub}"
      ANALYSIS_WORKER_ID: "worker-local"
    depends_on: { db: { condition: service_healthy } }
    deploy: { replicas: 1 }
    # drain 상한(600s) 보다 넉넉히. 짧으면 SIGKILL 이 보유 리스를 끊어 그 유닛이 처음부터 다시 돈다.
    stop_grace_period: 660s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ingress:
    profiles: [mtls]
    # stock nginx 가 아니라 **리포의 인그레스 이미지**를 굽는다 — Fargate 와 같은 이미지·같은
    # conf·같은 entrypoint 를 로컬에서도 태운다(로컬에서 통과한 설정이 라이브에서 다르게 돌지 않게).
    build: { context: .., dockerfile: deploy/Dockerfile.ingress }
    # ⚠️ **Fargate awsvpc 를 흉내낸다** — 같은 태스크의 컨테이너는 네트워크 namespace 를 공유하고
    #    localhost 로 통신한다. compose 기본(bridge + 서비스명 DNS)으로 두면 `api:8080` 은 로컬에서만
    #    되고 라이브에서 `host not found in upstream` 으로 죽는다. conf 가 `127.0.0.1:8080` 인
    #    이유이고, 여기서 namespace 를 공유해야 **로컬이 라이브와 같은 경로**를 탄다.
    network_mode: "service:api"
    # 로컬은 시크릿 ID 를 주지 않는다 → entrypoint 가 "이미 배치된 인증서" 경로를 탄다
    # (make-dev-certs.sh 산출물). 파일이 없으면 조용히 넘어가지 않고 기동에서 죽는다.
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on: { api: { condition: service_healthy } }

volumes:
  dbdata: {}
