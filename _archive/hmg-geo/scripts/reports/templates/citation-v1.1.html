<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#16181d; --mut:#737880; --line:#dfe2e7; --track:#edeff2; --soft:#f6f7f9;
    --brand:#002C5F; --brand-soft:#E4EAF1; --brand-ink:#002C5F; --brand-deep:#00142F;
    --font:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  html{font-size:10pt}
  body{font-family:var(--font);color:var(--ink);background:#fff;line-height:1.55;
    -webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:0}
  .page{position:relative;width:210mm;height:297mm;padding:16mm 15mm 13mm;
    display:flex;flex-direction:column;overflow:hidden;background:#fff}
  @media screen{body{background:#8b8e93;padding:22px 0}
    .page{margin:0 auto 22px;box-shadow:0 6px 28px rgba(0,0,0,.30)}}
  @media print{.page{break-after:page;page-break-after:always}
    .page:last-child{break-after:auto;page-break-after:auto}}
  .num{font-variant-numeric:tabular-nums}

  .ph{display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:11px;border-bottom:2px solid var(--ink);margin-bottom:18px}
  .ph .l .eb{font-size:8pt;font-weight:700;letter-spacing:.18em;color:var(--brand-ink);text-transform:uppercase}
  .ph .l h2{font-size:17pt;font-weight:800;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
  .ph .r{text-align:right;font-size:8pt;color:var(--mut);line-height:1.5}
  .ph .r b{display:block;font-size:9pt;color:var(--ink);font-weight:700}
  .pf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    font-size:7.4pt;color:var(--mut);border-top:1px solid var(--line);padding-top:7px}
  .pf b{color:var(--brand-ink);font-weight:700}

  .cv{padding:0}
  .cv-bar{height:8px;background:var(--brand)}
  .cv-in{flex:1;display:flex;flex-direction:column;padding:18mm 18mm 14mm}
  .cv-top{display:flex;justify-content:space-between;align-items:flex-start}
  .cv-logo{height:30px}.cv-logo svg{height:100%;width:auto;max-width:175px}
  .cv-tag{font-size:8.5pt;font-weight:700;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;text-align:right;line-height:1.7}
  .cv-mid{margin-top:auto;margin-bottom:auto}
  .cv-eb{font-size:10pt;font-weight:800;letter-spacing:.26em;color:var(--brand-ink);text-transform:uppercase}
  .cv-h1{font-size:46pt;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:14px}
  .cv-h2{font-size:16pt;font-weight:600;color:var(--mut);margin-top:12px;letter-spacing:-.01em}
  .cv-desc{font-size:10.5pt;color:#3a3f47;margin-top:22px;text-align:left;line-height:1.85;word-break:keep-all}
  .cv-meta{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-top:30px}
  .cv-meta .c{padding:13px 15px;border-right:1px solid var(--line)}
  .cv-meta .c:last-child{border-right:0}
  .cv-meta .k{font-size:7.6pt;color:var(--mut);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .cv-meta .v{font-size:11.5pt;font-weight:700;margin-top:4px;word-break:normal;overflow-wrap:anywhere;line-height:1.3}
  .cv-meta .vs{font-size:7.6pt;font-weight:600;color:var(--mut);margin-top:3px;line-height:1.3}
  .mk{font-weight:800;font-size:10pt;line-height:1}
  .mk-good{color:var(--brand)}
  .mk-warn{color:#D9822B}
  .mk-bad{color:#B23A34}
  .cv-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;
    font-size:8pt;color:var(--mut);border-top:1px solid var(--ink);padding-top:11px}

  .donut text{font-family:var(--font)}
  .dn-num{font-weight:800;fill:var(--ink)}
  .dn-unit{font-weight:700;fill:var(--mut)}

  .hero{display:flex;gap:24px;align-items:center;border:1px solid var(--line);
    border-radius:10px;padding:17px 26px;background:var(--soft)}
  .hero .ht{flex:1}
  .hero .ht .big{font-size:13pt;font-weight:800;line-height:1.4;letter-spacing:-.01em}
  .hero .ht .big em{font-style:normal;color:var(--brand-ink)}
  .hero .ht .sm{font-size:8.8pt;color:var(--mut);margin-top:9px;line-height:1.6}

  .kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .kpi3 .k3{border:1px solid var(--line);border-radius:9px;padding:14px 16px}
  .kpi3 .v{font-size:19pt;font-weight:800;letter-spacing:-.02em;color:var(--brand-ink)}
  .kpi3 .l{font-size:8.6pt;font-weight:700;margin-top:3px}
  .kpi3 .s{font-size:7.8pt;color:var(--mut);margin-top:2px}

  .dist{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:14px 22px}
  .dist-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}
  .dist-h .t{font-size:9pt;font-weight:800;letter-spacing:.04em;color:var(--brand-ink);text-transform:uppercase}
  .dist-h .s{font-size:8pt;color:var(--mut);font-weight:600}
  .dbar{display:flex;height:26px;border-radius:5px;overflow:hidden}
  .dbar i{display:flex;align-items:center;justify-content:center;font-size:8.4pt;font-weight:800;color:#fff;font-style:normal}
  .s-good{background:var(--brand)}
  .s-warn{background:#D9822B}
  .s-bad{background:#B23A34}
  .dleg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:8.2pt;color:var(--mut)}
  .dleg .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .dleg b{color:var(--ink);font-weight:700}

  .find{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:14px 22px}
  .find .ft{font-size:8.5pt;font-weight:800;letter-spacing:.06em;color:var(--brand-ink);text-transform:uppercase;margin-bottom:12px}
  .find ul{list-style:none;counter-reset:f}
  .find li{font-size:9.6pt;color:#2c3138;padding-left:20px;position:relative;margin-bottom:10px;line-height:1.65}
  .find li:last-child{margin-bottom:0}
  .find li::before{content:counter(f);counter-increment:f;position:absolute;left:0;top:2px;
    width:15px;height:15px;border-radius:50%;background:var(--brand);color:#fff;font-size:7.5pt;
    font-weight:700;display:flex;align-items:center;justify-content:center}
  .kpi3 .g{color:var(--brand-ink);font-weight:700}
  .kpi3 .stp{font-size:7.3pt;font-weight:800;letter-spacing:.06em;color:var(--brand-ink);text-transform:uppercase;margin-bottom:5px}
  .ddesc{font-size:8.3pt;color:var(--mut);line-height:1.55;margin:-4px 0 12px}
  .expect{margin-top:12px;border:1px solid var(--brand);border-radius:9px;padding:14px 22px;background:var(--brand-soft)}
  .expect .xt{font-size:12.5pt;font-weight:800;letter-spacing:-.01em;color:var(--brand-ink);margin-bottom:10px}
  .expect .xrow{display:flex;gap:10px;margin-bottom:7px;align-items:flex-start}
  .expect .xk{flex:0 0 auto;font-size:8pt;font-weight:800;color:#fff;background:var(--brand);border-radius:20px;padding:3px 11px;margin-top:2px;white-space:nowrap}
  .expect .xv{font-size:10.2pt;font-weight:700;color:#16181d;line-height:1.55}
  .expect .xnote2{font-size:8.3pt;color:var(--mut);margin-top:8px;line-height:1.5}
  .cv-guide{margin-top:24px;border-left:3px solid var(--brand);padding:4px 0 4px 16px}
  .cv-guide .gt{font-size:8.5pt;font-weight:800;letter-spacing:.08em;color:var(--brand-ink);text-transform:uppercase;margin-bottom:7px}
  .cv-guide ul{list-style:none}
  .cv-guide li{font-size:9.3pt;color:#3a3f47;margin-bottom:5px;line-height:1.6;padding-left:12px;position:relative}
  .cv-guide li::before{content:'·';position:absolute;left:2px;color:var(--brand);font-weight:800}
  .miles{margin-top:16px}
  .miles .mt{font-size:8.5pt;font-weight:800;letter-spacing:.06em;color:var(--brand-ink);text-transform:uppercase;margin-bottom:8px}
  .miles ul{list-style:none}
  .miles li{font-size:9.5pt;color:#2c3138;padding-left:14px;position:relative;margin-bottom:5px;line-height:1.5}
  .miles li::before{content:'·';position:absolute;left:4px;color:var(--brand);font-weight:800}

  .lead-x{font-size:9.3pt;color:var(--mut);margin-bottom:14px;line-height:1.55}
  .cards{display:flex;flex-direction:column;gap:13px}
  .card{border:1px solid var(--line);border-radius:10px;padding:16px 20px}
  .card .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .card .ch .nm{font-size:13pt;font-weight:800;letter-spacing:-.01em}
  .card .ch .en{font-size:8pt;color:var(--mut);font-weight:600;letter-spacing:.02em}
  .chip{display:inline-block;font-size:7.8pt;font-weight:700;padding:2.5px 9px;border-radius:20px;letter-spacing:.01em;margin-left:auto}
  .c-good{color:var(--brand-ink);background:var(--brand-soft)}
  .c-warn{color:#5a5f66;background:#eceef1}
  .c-bad{color:#fff;background:var(--brand)}
  .card .why{font-size:9.8pt;color:#23272d;line-height:1.6}
  .bench{margin-top:12px;padding-top:11px;border-top:1px solid var(--track);display:flex;flex-direction:column;gap:6px}
  .bench-row{display:flex;align-items:center;gap:12px}
  .bench-name{flex:0 0 27mm;font-size:8.2pt;color:var(--mut);font-weight:600}
  .bench-row.self .bench-name{color:var(--brand-ink);font-weight:800}
  .bench-track{flex:1;height:9px;background:var(--track);border-radius:5px;overflow:hidden}
  .bench-fill{height:100%;border-radius:5px;background:#aeb4bc}
  .bench-row.self .bench-fill{background:var(--brand)}
  .bench-val{flex:0 0 13mm;text-align:right;font-size:8.6pt;font-weight:700;color:var(--mut)}
  .bench-row.self .bench-val{color:var(--brand-ink);font-weight:800}

  .legend{display:flex;gap:18px;align-items:center;font-size:8.2pt;color:var(--mut);margin-bottom:13px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
  .d-good{background:var(--brand)}
  .d-warn{background:#c7ccd2}
  .d-bad{background:#fff;border:1.5px solid var(--brand)}
  .grp{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:11px}
  .grp-h{display:flex;align-items:center;gap:13px;padding:8px 15px;background:var(--soft);border-bottom:1px solid var(--line)}
  .grp-h .gt{font-size:10.5pt;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
  .grp-h .gt .cnt{color:var(--brand-ink);margin-left:6px}
  .grp-h .gg{flex:1;font-size:8pt;color:var(--mut);font-weight:600;text-align:right;line-height:1.35}
  .grp table{width:100%;border-collapse:collapse;table-layout:fixed}
  .grp th{font-size:7.5pt;color:var(--mut);font-weight:600;padding:5px 0;border-bottom:1px solid var(--track);text-align:center}
  .grp th.lf{text-align:left;padding-left:15px}
  .grp td{font-size:8.6pt;padding:6px 0;text-align:center;border-bottom:1px solid var(--track);vertical-align:middle}
  .grp tr:last-child td{border-bottom:0}
  .grp td.lf{text-align:left;padding-left:15px;padding-right:10px;color:#3a3f47}
  .grp td.lf .pt2{line-height:1.4;font-size:8.8pt;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .grp td.lf .pp{font-family:'SF Mono',ui-monospace,monospace;font-size:7.8pt;color:#555;
    word-break:break-all;overflow-wrap:anywhere;line-height:1.32;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .grp td.mo{color:var(--mut);font-style:italic;font-size:7.5pt;text-align:left;padding:5px 0 7px 15px}
  .cnote{font-size:9pt;color:#23272d;line-height:1.6;background:var(--brand-soft);border-left:3px solid var(--brand);
    border-radius:0 6px 6px 0;padding:11px 15px;margin:-4px 0 14px}
  .xnote{font-size:7.8pt;color:var(--mut);text-align:right;margin-top:3px}

  table.src{width:100%;border-collapse:collapse;border:1px solid var(--line)}
  table.src th{font-size:7.5pt;color:var(--mut);font-weight:600;padding:6px 0;border-bottom:1px solid var(--line);background:var(--soft);text-align:center}
  table.src th.lf{text-align:left;padding-left:15px}
  table.src td{font-size:8.8pt;padding:7px 0;border-bottom:1px solid var(--track);vertical-align:middle;text-align:center}
  table.src tr:last-child td{border-bottom:0}
  table.src td.lf{text-align:left;padding-left:15px;font-family:'SF Mono',ui-monospace,monospace;font-size:8.2pt;color:#3a3f47}
  table.src td.ty{font-size:7.9pt;color:var(--mut);text-align:left;padding-left:8px}
  table.src tr.ref{background:var(--brand-soft)}
  table.src tr.ref td.lf{font-weight:800;color:var(--brand-ink)}
  .sb{height:10px;background:#eef0f3;border-radius:5px;overflow:hidden;margin:0 12px}
  .sb i{display:block;height:100%;border-radius:5px}
  .sb .self{background:var(--brand)}
  .sb .own{background:#6E8CB2}
  .sb .ext{background:#c3c8cf}

  .diag{border:1px solid var(--line);border-radius:10px;padding:20px 22px}
  .diag .tag{display:inline-block;font-size:8.2pt;font-weight:800;color:#fff;background:var(--brand);
    padding:4px 12px;border-radius:20px;margin-bottom:14px;letter-spacing:.02em}
  .diag ul{list-style:none}
  .diag li{font-size:9.7pt;color:#2c3138;padding-left:14px;position:relative;margin-bottom:10px;line-height:1.7}
  .diag li:last-child{margin-bottom:0}
  .diag li::before{content:'·';position:absolute;left:4px;color:var(--brand);font-weight:800}

  .ax-h{font-size:11pt;font-weight:800;margin:6px 0 10px;letter-spacing:-.01em}
  .ax-h:not(:first-of-type){margin-top:20px}
  table.std{width:100%;border-collapse:collapse;border:1px solid var(--line)}
  table.std th{background:transparent;color:var(--ink);font-size:8.2pt;font-weight:800;text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink)}
  table.std td{font-size:8.6pt;padding:9px 12px;border-bottom:1px solid var(--track);vertical-align:top;line-height:1.5}
  table.std tr:last-child td{border-bottom:0}
  table.std td.lab{font-weight:700;white-space:nowrap;color:var(--brand-ink)}
  table.std td.lab small{display:block;color:var(--mut);font-weight:500;font-size:7.6pt;margin-top:1px}
  table.std td.gd{background:var(--brand-soft)}
  .apx-note{font-size:8pt;color:var(--mut);margin-top:6px}
</style>

<script>
const D = JSON.parse(document.getElementById('report-data').textContent);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dot = k => `<span class="dot d-${k}"></span>`;
const MARK = {good:'○', warn:'△', bad:'✕'};

function donut(pct, r, sw){
  const C = 2*Math.PI*r, f = C*pct/100, sz = (r+sw)*2+4, cx = sz/2;
  return `<svg class="donut" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="${sw}"
      stroke-dasharray="${f.toFixed(2)} ${(C-f).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>
    <text class="dn-num" x="${cx}" y="${cx}" text-anchor="middle" dominant-baseline="central"
      font-size="${r*0.52}">${pct}<tspan class="dn-unit" font-size="${r*0.3}">%</tspan></text>
  </svg>`;
}
function ph(eb,h2,r){return `<div class="ph"><div class="l"><div class="eb">${eb}</div><h2>${h2}</h2></div><div class="r">${r}</div></div>`;}
function pf(n){return `<div class="pf"><span>GEO Citation Report · <b>${esc(D.scope)}</b></span><span>${esc(D.org)} &nbsp;·&nbsp; ${String(n).padStart(2,'0')} / ${String(D.totalPages).padStart(2,'0')}</span></div>`;}
const hdrR = `<b>${esc(D.scope)}</b>${esc(D.site)}`;

function cover(){
  const m = D.cover.meta.map(c=>`<div class="c"><div class="k">${esc(c.k)}</div><div class="v num">${esc(c.v)}</div>${c.s?`<div class="vs num">${esc(c.s)}</div>`:''}</div>`).join('');
  return `<section class="page cv">
    <div class="cv-bar"></div>
    <div class="cv-in">
      <div class="cv-top">
        <div class="cv-logo">${D.logoSvg}</div>
        <div class="cv-tag">Generative Engine<br>Optimization</div>
      </div>
      <div class="cv-mid">
        <div class="cv-eb">${esc(D.cover.kicker)}</div>
        <div class="cv-h1">${esc(D.cover.h1)}</div>
        <div class="cv-h2">${esc(D.cover.h2)}</div>
        <p class="cv-desc">${esc(D.cover.desc)}</p>
        ${D.cover.guide?`<div class="cv-guide"><div class="gt">이 리포트를 읽는 관점</div><ul>${D.cover.guide.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
        <div class="cv-meta">${m}</div>
      </div>
      <div class="cv-foot"><span>${esc(D.org)} · GEO Citation Report · ${esc(D.date)}</span><span>${esc(D.cover.confidential)}</span></div>
    </div>
  </section>`;
}

function summary(){
  const K = D.kpis, ds = D.dist, T = ds.total;
  const pc = n => (n/T*100).toFixed(1)+'%';
  const gp=Math.round(ds.good/T*100), wp=Math.round(ds.warn/T*100), bp=100-gp-wp;
  const k3 = ['owned','share','target'].map(k=>`<div class="k3">
      ${K[k].step?`<div class="stp">${K[k].step}</div>`:''}
      <div class="v num">${K[k].v}%</div><div class="l">${K[k].label}</div>
      ${K[k].def?`<div class="s">${K[k].def}</div>`:''}
      <div class="s num">${K[k].n.toLocaleString()} / ${K[k].t.toLocaleString()} ${K[k].unit}</div>
      ${K[k].g!=null?`<div class="s num g">글로벌 평균 ${K[k].g}%</div>`:''}</div>`).join('');
  const fnd = D.findings.map(f=>`<li>${esc(f)}</li>`).join('');
  return `<section class="page">
    ${ph('Executive Summary','핵심 측정 요약',hdrR)}
    <div class="hero">
      <div class="gauge">${donut(D.kpis.owned.v, 40, 13)}</div>
      <div class="ht"><div class="big">${D.sumBig}</div><div class="sm">${esc(D.sumSm)}</div></div>
    </div>
    <div class="kpi3">${k3}</div>
    <div class="dist">
      <div class="dist-h"><span class="t">타겟 URL 도달 분포</span><span class="s num">프롬프트 ${T}개</span></div>
      ${ds.desc?`<div class="ddesc">${esc(ds.desc)}</div>`:''}
      <div class="dbar">
        <i class="s-good" style="width:${pc(ds.good)}">${ds.good}</i>
        <i class="s-warn" style="width:${pc(ds.warn)}">${ds.warn}</i>
        <i class="s-bad" style="width:${pc(ds.bad)}">${ds.bad}</i>
      </div>
      <div class="dleg">
        <span><span class="mk mk-good">○</span> ${ds.labels.good} <b class="num">${ds.good}</b> · ${gp}%</span>
        <span><span class="mk mk-warn">△</span> ${ds.labels.warn} <b class="num">${ds.warn}</b> · ${wp}%</span>
        <span><span class="mk mk-bad">✕</span> ${ds.labels.bad} <b class="num">${ds.bad}</b> · ${bp}%</span>
      </div>
    </div>
    <div class="find"><div class="ft">핵심 발견</div><ul>${fnd}</ul></div>
    ${D.expect?`<div class="expect"><div class="xt">${esc(D.expect.t)}</div>
      ${(D.expect.rows||[]).map(r=>`<div class="xrow"><span class="xk">${esc(r.k)}</span><span class="xv">${esc(r.v)}</span></div>`).join('')}
      ${D.expect.note?`<div class="xnote2">${esc(D.expect.note)}</div>`:''}</div>`:''}
    ${pf(2)}
  </section>`;
}

function metrics(){
  const N = D.benchNames;
  const c = D.metrics.map(m=>{
    const row = (name, v, self) => `<div class="bench-row ${self?'self':''}">
      <span class="bench-name">${esc(name)}</span>
      <div class="bench-track"><div class="bench-fill" style="width:${Math.min(100,v).toFixed(1)}%"></div></div>
      <span class="bench-val num">${v.toFixed(1)}%</span></div>`;
    return `<div class="card">
      <div class="ch"><span class="nm">${esc(m.label)}</span><span class="en">${esc(m.en)}</span>
        <span class="chip c-${m.verdict}">판정 ${esc(m.vtext)}</span></div>
      <div class="why">${esc(m.why)}</div>
      <div class="bench">${row(N.self,m.self,true)}${row(N.global,m.global,false)}${row(N.brand,m.brandAvg,false)}</div>
    </div>`;
  }).join('');
  return `<section class="page">
    ${ph('Metrics & Benchmark','지표 정의와 전사 대비 위치',hdrR)}
    <div class="lead-x">${esc(D.metricsLead)}</div>
    <div class="cards">${c}</div>
    ${pf(3)}
  </section>`;
}

function cases(){
  const grps = D.caseGroups.map(g=>{
    const rows = g.rows.map(r=>`<tr>
      <td class="lf"><div class="pt2">${esc(r.p)}</div></td>
      <td class="lf"><span class="pp">${esc(r.u)}</span></td>
      <td class="num">${esc(r.n)}</td>
      <td><span class="mk mk-${r.v}">${MARK[r.v]}</span></td></tr>`).join('');
    const more = g.more?`<tr><td class="mo" colspan="4">${esc(g.more)}</td></tr>`:'';
    return `<div class="grp">
      <div class="grp-h"><span class="gt">${esc(g.label)}<span class="cnt num">${g.count}</span></span>
        <span class="gg">${esc(g.gap)}</span></div>
      <table><colgroup><col style="width:44%"><col style="width:34%"><col style="width:12%"><col style="width:10%"></colgroup>
      <thead><tr><th class="lf">프롬프트</th><th class="lf">지정 페이지 (base 이하 경로)</th><th>자사 인용 답변</th><th>타겟 도달</th></tr></thead>
      <tbody>${rows}${more}</tbody></table>
    </div>`;
  }).join('');
  return `<section class="page">
    ${ph('Prompt-level Detail','프롬프트별 인용 사례',hdrR)}
    <div class="lead-x">${esc(D.casesLead)}</div>
    ${D.caseGroups[1]?.note?`<div class="cnote">${esc(D.caseGroups[1].note)}</div>`:''}
    <div class="legend"><span><span class="mk mk-good">○</span> 지정 페이지까지 정확 인용</span><span><span class="mk mk-warn">△</span> 사이트는 인용, 지정 페이지 미도달</span><span><span class="mk mk-bad">✕</span> 사이트 인용 없음</span></div>
    ${grps}
    <div class="xnote">전체 ${D.dist.total}개 프롬프트 점검 내역은 동봉 데이터 파일(.xlsx)에 수록.</div>
    ${pf(4)}
  </section>`;
}

function sources(){
  const tot = D.kpis.share.t;
  const pctS = n => (n/tot*100);
  const bar = (n, cls) => `<div class="sb"><i class="${cls}" style="width:${pctS(n).toFixed(1)}%"></i></div>`;
  const ref = `<tr class="ref"><td class="num">—</td><td class="lf">${esc(D.srcBase.k)}</td>
    <td>${bar(D.srcBase.n,'self')}</td><td class="num" style="font-weight:800">${pctS(D.srcBase.n).toFixed(1)}%</td><td class="num" style="font-weight:800">${D.srcBase.n}</td><td class="ty">${esc(D.srcBase.t)}</td></tr>`;
  const rows = D.sources.map((s,i)=>`<tr><td class="num">${i+1}</td><td class="lf">${esc(s.k)}</td>
    <td>${bar(s.n,s.c)}</td><td class="num">${pctS(s.n).toFixed(1)}%</td><td class="num">${s.n}</td><td class="ty">${esc(s.t)}</td></tr>`).join('');
  return `<section class="page">
    ${ph('Citation Sources','인용 출처 비교 — 자사 base 대비 대체 출처',hdrR)}
    <div class="lead-x">${esc(D.srcLead)}</div>
    <table class="src"><colgroup><col style="width:6%"><col style="width:25%"><col style="width:30%"><col style="width:9%"><col style="width:8%"><col style="width:22%"></colgroup>
      <thead><tr><th>#</th><th class="lf">도메인 / 경로</th><th>인용 점유율 (0~100%)</th><th>점유율</th><th>인용 수</th><th class="lf" style="padding-left:8px">유형</th></tr></thead>
      <tbody>${ref}${rows}</tbody></table>
    <div class="xnote">${esc(D.srcNote)}</div>
    ${pf(5)}
  </section>`;
}

function obsApx(){
  const li = D.obs.li.map(x=>`<li>${esc(x)}</li>`).join('');
  const cr = D.apxCrit.rows.map(r=>`<tr><td class="lab">${esc(r.item)}${r.sub?`<small>${esc(r.sub)}</small>`:``}</td><td class="gd">${esc(r.good)}</td><td>${esc(r.warn)}</td><td>${esc(r.bad)}</td></tr>`).join('');
  const tm = D.terms.map(t=>`<tr><td class="lab">${esc(t.t)}${t.sub?`<small>${esc(t.sub)}</small>`:''}</td><td>${esc(t.d)}</td></tr>`).join('');
  return `<section class="page">
    ${ph('Observations','관찰 요약',hdrR)}
    <div class="diag"><span class="tag">${esc(D.obs.tag)}</span><ul>${li}</ul></div>
    <div class="miles" style="margin-top:16px"><div class="mt">${esc(D.milestone.t)}</div><ul>${D.milestone.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${pf(6)}
  </section><section class="page">
    ${ph('Appendix','부록 · 판정 기준과 용어',hdrR)}
    <div class="ax-h">${esc(D.apxCrit.t)}</div>
    <table class="std"><thead><tr><th style="width:34mm">${D.apxCrit.cols[0]}</th><th>${D.apxCrit.cols[1]}</th><th>${D.apxCrit.cols[2]}</th><th>${D.apxCrit.cols[3]}</th></tr></thead><tbody>${cr}</tbody></table>
    <div class="apx-note">${D.apxCrit.note}</div>
    <div class="ax-h">용어 설명</div>
    <table class="std"><thead><tr><th style="width:40mm">용어</th><th>설명</th></tr></thead><tbody>${tm}</tbody></table>
    ${pf(7)}
  </section>`;
}

document.getElementById('report').innerHTML = cover()+summary()+metrics()+cases()+sources()+obsApx();
document.title = `GEO Citation Report — ${D.scope}`;
</script>
</body>
</html>
