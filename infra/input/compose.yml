name: hmg-geo-hub-input
services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: hgh-input-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: input_db
      POSTGRES_USER: hmg_input_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the HUB storage initializer first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${HGH_INPUT_DB_PORT:-55438}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmg_input_admin -d input_db"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
    name: hgh-input-pgdata
networks:
  default:
    name: hgh-input-network
