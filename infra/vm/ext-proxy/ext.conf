# External API proxy on the internal VM (scripts/vm.sh proxy): TLS with the VM's self-signed certificate,
# callers from the internal network only, GET under /ext/ only. The app limits failed keys per client address;
# it sees $remote_addr through X-Forwarded-For and trusts that header from this proxy's address alone.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/ext.crt;
    ssl_certificate_key /etc/nginx/tls/ext.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;

    allow 10.0.0.0/8;
    deny all;

    location /ext/ {
        limit_except GET { deny all; }
        proxy_pass http://hgh-ext-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
