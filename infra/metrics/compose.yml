name: hmg-geo-hub-metrics
services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: hgh-metrics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hmg_metrics
      POSTGRES_USER: hmg_metrics_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the HUB storage initializer first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${HGH_METRICS_DB_PORT:-55439}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmg_metrics_admin -d hmg_metrics"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
    name: hgh-metrics-pgdata
networks:
  default:
    name: hgh-metrics-network
