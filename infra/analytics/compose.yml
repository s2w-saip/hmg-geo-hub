name: hmg-geo-hub-analytics
services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: hgh-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hmg_analytics
      POSTGRES_USER: hmg_analytics_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the analytics initializer first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${HGH_ANALYTICS_DB_PORT:-55436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmg_analytics_admin -d hmg_analytics"]
      interval: 5s
      timeout: 3s
      retries: 12
    shm_size: 256mb
volumes:
  pgdata:
    name: hgh-analytics-pgdata
networks:
  default:
    name: hgh-analytics-network
